<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capital Flow Map — NSE Sectors</title>
<style>
:root{--bg:#f6f7f9;--fg:#1a1d21;--mut:#6b7280;--card:#fff;--rbg:#fdeef1;--rbd:#f2c0cc;--rc:#b0103a;--gbg:#eefaf2;--gbd:#bfe8cf;--gc:#0a7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--mut:#9aa0a6;--card:#1a1e24;--rbg:#2a1519;--rbd:#5a2530;--rc:#ff6b8b;--gbg:#122318;--gbd:#24503a;--gc:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:16px}h1{font-size:13px;letter-spacing:.14em;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:var(--mut);font-size:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.bar button,.bar label{border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer}
.bar button.on{background:var(--fg);color:var(--bg)}
.note{background:var(--card);border:1px dashed var(--mut);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mut);margin-bottom:14px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.hd{border-radius:10px;padding:12px;margin-bottom:10px;font-weight:700}
.out .hd,.out details{background:var(--rbg);border:1px solid var(--rbd)}.in .hd,.in details{background:var(--gbg);border:1px solid var(--gbd)}
.out{--c:var(--rc);--b:var(--rbd)}.in{--c:var(--gc);--b:var(--gbd)}.hd{color:var(--c)}.hd small{font-weight:400;color:var(--mut);margin-left:6px}
details{border-radius:10px;padding:12px 14px;margin-bottom:10px}summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}summary::-webkit-details-marker{display:none}
.rk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.nm{flex:1;min-width:0}.nm b{font-size:15px}.nm span{display:block;font-size:11px;color:var(--mut)}
.rt{text-align:right;color:var(--c)}.rt b{font-size:20px;display:block}.rt span{font-size:11px}
.st{margin-top:10px;border-top:1px solid var(--b);padding-top:8px}.st h4{margin:0 0 4px;font-size:10px;color:var(--mut)}
.st div{display:flex;justify-content:space-between;padding:3px 0}.st b{color:var(--c)}.sc{max-height:240px;overflow-y:auto}
.pn{background:var(--card);border:1px solid var(--mut);border-radius:12px;padding:12px 14px;margin-bottom:16px}.pn h3{margin:0 0 8px;font-size:14px}.pn .bar{margin:6px 0 10px;justify-content:flex-start}
.sl{max-height:320px;overflow-y:auto}.sr{padding:7px 0;border-top:1px solid var(--mut)}.sr b{font-size:14px}.sr small{display:block;color:var(--mut);font-size:11px}.sr .r{float:right;font-weight:700}
.sg{font-style:normal;font-size:10px;font-weight:600;border:1px solid;border-radius:8px;padding:0 6px;margin-right:4px}.sg.b{color:var(--gc)}.sg.s{color:var(--rc)}
.cp{font-style:normal;font-size:9px;border:1px solid var(--mut);color:var(--mut);border-radius:8px;padding:0 5px;margin-left:4px}
</style></head><body><main>
<h1>CAPITAL FLOW MAP</h1><div class="sub" id="sub">Loading...</div>
<section id="top5" class="pn" style="display:none"></section><section id="wl" class="pn" style="display:none"></section>
<div class="bar"><button id="simpleBtn">🎯 Simple Mode</button></div>
<div id="advWrap">
<div class="bar" style="margin-bottom:8px"><input id="sq" type="text" placeholder="🔍 Search stock or sector..." style="flex:1;min-width:200px;border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px;font-size:14px"></div>
<div id="sres" class="pn" style="display:none"></div><div class="bar" id="tabs"></div>
<div class="bar"><label style="position:relative;overflow:hidden">📂 Load CSV / NSDL<input id="f" type="file" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer"></label><button id="pb">📋 Paste CSV / NSDL</button></div>
<div id="pw" style="display:none;margin-bottom:14px"><textarea id="ta" rows="5" style="width:100%;border:1px solid var(--mut);border-radius:8px;background:var(--card);color:var(--fg);padding:8px;font:12px monospace" placeholder="Paste flow.csv OR copied NSDL Fortnightly FPI page text here"></textarea><div class="bar" style="margin-top:8px"><button id="pgo">Load pasted data</button></div></div>
<div class="note" id="note">Connecting live market feeds...</div>
<section id="short" class="pn" style="display:none"></section><section id="sigp" class="pn" style="display:none"></section>
<section id="rot" class="pn" style="display:none;overflow-x:auto"></section><section id="trend" class="pn" style="display:none"></section>
<section id="sahil" class="pn" style="display:none"></section><section id="wlView" class="pn" style="display:none"></section>
<div class="grid" id="mainGrid"><section class="out"><div class="hd">🔴 MONEY FLOWING OUT<small>investors selling</small></div><div id="out"></div></section>
<section class="in"><div class="hd">🟢 MONEY FLOWING IN<small>investors buying</small></div><div id="in"></div></section></div>
</div></main>
<script>
const PERIODS=[["1W","1 Week"],["1M","1 Month"],["3M","3 Months"],["6M","6 Months"]],CAPS=["Large","Mid","Small","Micro"];
let sig="All",cap="All",mode="price",view="top",period="1M",rows=[],bench={},NSDL_DATE="16–31 Oct 2026",NSDL_HISTORY={};
let NSDL={"Information Technology":[2599,398397],"Services":[262,186896],"Media, Entertainment & Publication":[252,11084],"Diversified":[43,3626],"Chemicals":[41,119343],"Utilities":[-34,2725],"Forest Materials":[-50,1176],"Textiles":[-59,21265],"Construction Materials":[-564,94263],"Realty":[-578,111753],"Consumer Durables":[-586,179333],"Construction":[-1224,112879],"Power":[-1732,235832],"Consumer Services":[-1931,287273],"Oil, Gas & Consumable Fuels":[-3680,429974],"Metals & Mining":[-3693,263323],"Capital Goods":[-3886,476822],"Telecommunication":[-3928,343057],"Healthcare":[-5497,504679],"Automobile and Auto Components":[-6533,477593],"Fast Moving Consumer Goods":[-8172,268394],"Financial Services":[-8634,2035663]};
try{const sv=JSON.parse(localStorage.getItem("cfm_nsdl_v1")||"null");if(sv&&sv.data){NSDL=sv.data;if(sv.date)NSDL_DATE=sv.date;if(sv.history)NSDL_HISTORY=sv.history;}}catch(e){}
let FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));

const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const avg=a=>(a&&a.length)?a.reduce((x,y)=>x+y,0)/a.length:0;
const fmt=n=>Math.abs(n||0).toLocaleString("en-IN");
const capOf=v=>/micro/i.test(v||"")?"Micro":/mid/i.test(v||"")?"Mid":/small/i.test(v||"")?"Small":/large/i.test(v||"")?"Large":"";
const ago=n=>n===""||n==null?"":+n===0?"today":+n===1?"1 bar ago":n+" bars ago";
const canon=x=>{const n=(x||"").replace(/,/g,"").trim();return Object.keys(NSDL).find(k=>k.replace(/,/g,"")===n)||(x||"").trim()};
function resolveSym(v){let s=(v||"").trim().toUpperCase().replace(/\.NS$/,"").replace(/\s+/g,"");if(!s)return"";if(s==="APAR"||s==="APARINDUSTRIES")return"APARINDS";const ex=rows.find(x=>x.Symbol.toUpperCase()===s);if(ex)return ex.Symbol;const pt=rows.find(x=>x.Symbol.toUpperCase().startsWith(s));return pt?pt.Symbol:s;}

function splitCSV(l){const o=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===","&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
function parseCSV(t){const L=t.replace(/^\uFEFF/,"").trim().split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];const h=splitCSV(L.shift()).map(x=>x.trim());return L.map(l=>{const c=splitCSV(l),o={};h.forEach((k,i)=>o[k]=c[i]?c[i].trim():"");return o;});}

function load(recs){
  bench={};rows=[];
  for(const r of recs){
    const o={
      Symbol:r.Symbol||"?",Industry:canon(r.Industry),Cap:capOf(r.Cap),Price:parseFloat(r.Price)||"",
      Daily:(r.Daily||"").toUpperCase(),Weekly:(r.Weekly||"").toUpperCase(),
      DFresh:r.DFresh||"",WFresh:r.WFresh||"",
      DTurnAgo:r.DTurnAgo!==""&&r.DTurnAgo!=null?+r.DTurnAgo:"",WTurnAgo:r.WTurnAgo!==""&&r.WTurnAgo!=null?+r.WTurnAgo:"",
      DCross:(r.DCross||"").toUpperCase(),DCrossAgo:r.DCrossAgo!==""&&r.DCrossAgo!=null?+r.DCrossAgo:"",
      WCross:(r.WCross||"").toUpperCase(),WCrossAgo:r.WCrossAgo!==""&&r.WCrossAgo!=null?+r.WCrossAgo:"",
      EMA20:r.EMA20||"",EMA50:r.EMA50||"",EMA100:r.EMA100||"",EMA200:r.EMA200||"",
      RSState:r.RSState||"",RSPos:(r.RSPos||"").toUpperCase(),RS_Rank:parseInt(r.RS_Rank)||50,
      DelivPct:parseFloat(r.DelivPct)||"",DelivHigh:(r.DelivHigh||"").toUpperCase(),
      RSI_D:parseFloat(r.RSI_D),RSI_W:parseFloat(r.RSI_W),RSI_M:parseFloat(r.RSI_M),
      DConfirmed:(r.DConfirmed||"").toUpperCase(),WConfirmed:(r.WConfirmed||"").toUpperCase(),
      DLine:parseFloat(r.DLine),DUpper:parseFloat(r.DUpper),DLower:parseFloat(r.DLower),
      SahilD:(r.SahilD||"").toUpperCase(),SahilDAgo:r.SahilDAgo!==""&&r.SahilDAgo!=null?+r.SahilDAgo:"",SahilD_BO:r.SahilD_BO||"",SahilD_TSL:r.SahilD_TSL||"",
      SahilW:(r.SahilW||"").toUpperCase(),SahilWAgo:r.SahilWAgo!==""&&r.SahilWAgo!=null?+r.SahilWAgo:"",SahilW_BO:r.SahilW_BO||"",SahilW_TSL:r.SahilW_TSL||""
    };
    PERIODS.forEach(([p])=>o[p]=parseFloat(r[p]));
    if(/^NIFTY ?500$/i.test(o.Symbol))PERIODS.forEach(([p])=>bench[p]=o[p]);
    else if(o.Industry&&!isNaN(o[period]))rows.push(o);
  }
  PERIODS.forEach(([p])=>{if(bench[p]==null){const v=rows.map(x=>x[p]).filter(x=>!isNaN(x));bench[p]=v.length?avg(v):0}});
  renderTop5();render();
}

function buyScore(r,sm){
  let s=0,R=[];
  if(r.Daily==="BUY"&&r.DConfirmed==="Y"){s+=2;R.push("Daily BUY")}
  if(r.Weekly==="BUY"&&r.WConfirmed==="Y"){s+=2;R.push("Weekly BUY")}
  if(!isNaN(r.RSI_D)&&r.RSI_D>40&&r.RSI_D<70){s+=1;R.push("RSI D:"+r.RSI_D+(isNaN(r.RSI_W)?"":" W:"+r.RSI_W))}
  if(r.RSPos==="Y"){s+=1;R.push("RS+")}
  if(r.RSState==="Rising"){s+=1;R.push("RS rising")}
  if(r.RS_Rank>=80){s+=1;R.push("RS "+r.RS_Rank)}
  if(r.DelivHigh==="Y"||(r.DelivPct&&r.DelivPct>=50)){s+=1;R.push("Deliv "+r.DelivPct+"%")}
  if((r.DTurnAgo!==""&&r.DTurnAgo<=2)||(r.WTurnAgo!==""&&r.WTurnAgo<=1)){s+=1;R.push("fresh")}
  if(!isNaN(r["1M"])&&r["1M"]>sm){s+=1;R.push("beats sector")}
  return{score:Math.min(10,s),reasons:R};
}
const slTarget=r=>isNaN(r.DLine)?null:{sl:r.DLower,target:r.DUpper};
const rsiStr=r=>(!isNaN(r.RSI_D)||!isNaN(r.RSI_W))?`RSI D:${isNaN(r.RSI_D)?"—":r.RSI_D} W:${isNaN(r.RSI_W)?"—":r.RSI_W}`:"";
const delivStr=r=>r.DelivPct?`Deliv:${r.DelivPct}%${r.DelivHigh==="Y"?"🔥":""}`:"";

function flowTag(r){
  if(!r)return"";
  const indRows=r.Industry&&r.Industry!=="Others"?rows.filter(x=>x.Industry===r.Industry&&!isNaN(x[period])):[];
  const val=indRows.length?avg(indRows.map(x=>x[period])):r[period];
  if(isNaN(val))return"";
  return val>=0?`<i class="sg b">money in</i>`:`<i class="sg s">money out</i>`;
}

const wlGet=()=>{try{return JSON.parse(localStorage.getItem("cfm_watchlist_v1")||"{}")}catch(e){return{}}};
const wlSet=(sym,status,price)=>{try{const w=wlGet();w[sym]={status,price:price||"",added:new Date().toISOString().slice(0,10)};localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist();if(mode==="watchlist")renderWatchlistTab()};
const wlRemove=sym=>{try{const w=wlGet();delete w[sym];localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist();if(mode==="watchlist")renderWatchlistTab()};
const watchBtns=(sym,price)=>{const st=(wlGet()[sym]||{}).status||"";return`<button data-wl="watch" data-sym="${esc(sym)}" data-px="${price||""}">${st==="watch"?"★ Watching":"☆ Watch"}</button> <button data-wl="bought" data-sym="${esc(sym)}" data-px="${price||""}">${st==="bought"?"✓ Bought":"Mark Bought"}</button>`;};

function renderWatchlist(){
  const el=document.getElementById("wl"),w=wlGet(),syms=Object.keys(w);el.style.display="block";
  const lines=syms.map(sym=>{
    const rec=w[sym],r=rows.find(x=>x.Symbol.toUpperCase()===sym.toUpperCase()),now=r?r.Price:"";
    const chg=(now&&rec.price)?((now-rec.price)/rec.price*100):null;
    const meta=r?[rsiStr(r),delivStr(r)].filter(Boolean).join(" · "):"";
    const badges=r?`<div style="margin-top:4px"><span class="sg ${r.Daily==="BUY"?"b":"s"}">Daily ${r.Daily}</span><span class="sg ${r.Weekly==="BUY"?"b":"s"}">Weekly ${r.Weekly}</span>${flowTag(r)}</div>`:"";
    return`<div class="sr"><button data-wlrm="${esc(sym)}" style="float:right;border:none;background:none;color:var(--mut);font-size:16px">✕</button><b>${esc(sym)}</b> <i class="cp">${rec.status==="bought"?"Bought":"Watching"}</i>${r?` <span class="cp">RS:${r.RS_Rank}</span>`:""}<small>${now?"₹"+now:""}${chg!==null?" ("+(chg>=0?"+":"")+chg.toFixed(1)+"%)":""}${meta?" · "+meta:""}</small>${badges}</div>`;
  }).join("");
  el.innerHTML=`<h3>⭐ My Watchlist</h3><div style="display:flex;gap:8px;margin:8px 0;max-width:360px"><input id="wlHomeInput" type="text" placeholder="Symbol (e.g. APARINDS)..." style="flex:1;border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 14px;font-size:12px;text-transform:uppercase"><button id="wlHomeAddBtn" class="on">+ Add</button></div><div class="sl">${lines||"<small style='color:var(--mut)'>No stocks yet.</small>"}</div>`;
  const add=()=>{const inp=document.getElementById("wlHomeInput");if(!inp)return;const v=resolveSym(inp.value);if(!v)return;const f=rows.find(x=>x.Symbol.toUpperCase()===v.toUpperCase());wlSet(v,"watch",f?f.Price:"");inp.value="";};
  document.getElementById("wlHomeAddBtn").onclick=add;document.getElementById("wlHomeInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add();}};
}

function renderWatchlistTab(){
  hideAll("wlView");const el=document.getElementById("wlView"),w=wlGet(),syms=Object.keys(w);
  const cards=syms.map(sym=>{
    const rec=w[sym],r=rows.find(x=>x.Symbol.toUpperCase()===sym.toUpperCase()),now=r?r.Price:"",st=r?slTarget(r):null;
    const meta=r?[rsiStr(r),delivStr(r)].filter(Boolean).join(" · "):"";
    return`<div class="sr"><button data-wlrm="${esc(sym)}" style="float:right;border:none;background:none;color:var(--mut);font-size:18px">✕</button><b>${esc(sym)}</b> · ₹${now||"—"} ${r?`<span class="cp">RS:${r.RS_Rank}</span>`:""}<div style="margin:6px 0"><span class="sg ${r&&r.Daily==="BUY"?"b":"s"}">Daily ${r?r.Daily:"—"}</span><span class="sg ${r&&r.Weekly==="BUY"?"b":"s"}">Weekly ${r?r.Weekly:"—"}</span>${flowTag(r)}</div>${meta?`<small>${meta}</small>`:""}${st?`<small>SL ~₹${st.sl} · Target ~₹${st.target}</small>`:""}</div>`;
  }).join("");
  el.innerHTML=`<h3>⭐ My Watchlist</h3><div style="display:flex;gap:8px;margin:10px 0;max-width:400px"><input id="wlAddInput" type="text" placeholder="Symbol..." style="flex:1;border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px;font-size:13px;text-transform:uppercase"><button id="wlAddBtn" class="on">+ Add</button></div><div class="sl">${cards||"<small>Watchlist is empty.</small>"}</div>`;
  const add=()=>{const inp=document.getElementById("wlAddInput");if(!inp)return;const v=resolveSym(inp.value);if(!v)return;const f=rows.find(x=>x.Symbol.toUpperCase()===v.toUpperCase());wlSet(v,"watch",f?f.Price:"");inp.value="";};
  document.getElementById("wlAddBtn").onclick=add;document.getElementById("wlAddInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add();}};
  document.getElementById("tabs").innerHTML=bar(false);
}

document.addEventListener("click",e=>{const d=e.target.dataset;if(d.wl)wlSet(d.sym,d.wl,parseFloat(d.px)||"");else if(d.wlrm)wlRemove(d.wlrm);});
let simpleMode=false;document.getElementById("simpleBtn").onclick=()=>{simpleMode=!simpleMode;document.getElementById("advWrap").style.display=simpleMode?"none":"block";document.getElementById("simpleBtn").textContent=simpleMode?"🔍 Advanced Mode":"🎯 Simple Mode";};

function renderTop5(){
  const el=document.getElementById("top5");if(!rows.some(x=>x.Daily)){el.style.display="none";renderWatchlist();return;}el.style.display="block";
  const secAvg={};rows.forEach(r=>{(secAvg[r.Industry]??=[]).push(r["1M"])});Object.keys(secAvg).forEach(k=>{const v=secAvg[k].filter(x=>!isNaN(x));secAvg[k]=v.length?avg(v):0;});
  const picks=rows.filter(r=>r.Daily==="BUY"&&r.DConfirmed==="Y"&&r.Weekly==="BUY"&&r.WConfirmed==="Y").map(r=>{const {score,reasons}=buyScore(r,secAvg[r.Industry]||0),st=slTarget(r);return{r,score,reasons,st};}).sort((a,b)=>b.score-a.score||b.r["1M"]-a.r["1M"]).slice(0,5);
  el.innerHTML=`<h3>🎯 Today's Top 5 Picks — Daily+Weekly BUY</h3><div class="sl">${picks.length?picks.map((o,i)=>`<div class="sr"><span class="r" style="color:var(--gc)">${o.score}/10</span><b>${i+1}. ${esc(o.r.Symbol)}</b> <span class="cp">RS:${o.r.RS_Rank}</span><small>${esc(o.r.Industry)} · 1M ${o.r["1M"]>=0?"+":""}${o.r["1M"].toFixed(1)}% · ${rsiStr(o.r)} · ${delivStr(o.r)}</small><small>${o.reasons.join(" · ")}</small>${o.st?`<small>SL ~₹${o.st.sl} · Target ~₹${o.st.target}</small>`:""}<div class="bar" style="margin:4px 0 0">${watchBtns(o.r.Symbol,o.r.Price)}</div></div>`).join(""):"<small>No confirmed Daily+Weekly BUY stocks right now.</small>"}</div>`;
  renderWatchlist();
}

const sigOK=x=>sig==="All"||(sig==="D"&&x.Daily==="BUY")||(sig==="W"&&x.Weekly==="BUY")||(sig==="DW"&&x.Daily==="BUY"&&x.Weekly==="BUY")||(sig==="DS"&&x.Daily==="SELL")||(sig==="WS"&&x.Weekly==="SELL")||(sig==="DWS"&&x.Daily==="SELL"&&x.Weekly==="SELL");
const chip=(t,v,f)=>v?`<i class="sg ${v==="BUY"?"b":"s"}">${t} ${v}${f?" ★":""}</i>`:"";

function card(i,name,stocks,inflow){
  const m=avg(stocks.map(s=>s[period])),b=bench[period]||0,rel=m-b,beat=stocks.filter(s=>s[period]>b).length,top=stocks.filter(sigOK).sort((a,c)=>inflow?c[period]-a[period]:a[period]-c[period]);
  return`<details><summary><span class="rk">${i}</span><span class="nm"><b>${esc(name)}</b><span>${stocks.length} stocks · ${beat} beat Nifty 500</span>${FPI[name]?`<span>FPI ₹${fmt(FPI[name])} Cr</span>`:""}</span><span class="rt"><b>${m>=0?"+":""}${m.toFixed(1)}%</b><span>${rel>=0?"▲ OUT":"▼ UNDER"} Nifty 500 by ${Math.abs(rel).toFixed(1)}%</span></span></summary><div class="st"><h4>${top.length} OF ${stocks.length} STOCKS</h4><div class="sc">${top.map(s=>`<div><span>${esc(s.Symbol)} <span class="cp">RS:${s.RS_Rank}</span> <span class="cp">${rsiStr(s)}</span> <span class="cp">${delivStr(s)}</span><br>${chip("D",s.Daily,s.DFresh)}${chip("W",s.Weekly,s.WFresh)}</span><b>${s[period]>=0?"+":""}${s[period].toFixed(1)}%</b></div>`).join("")}</div></div></details>`;
}

function cardF(i,name,flow,auc,inflow){return`<details><summary><span class="rk">${i}</span><span class="nm"><b>${esc(name)}</b><span>FPI ₹${fmt(auc)} Cr</span></span><span class="rt"><b>${flow>=0?"+":"−"}₹${fmt(flow)} Cr</b><span>${auc>0?(flow/auc*100).toFixed(2):"0"}%</span></span></summary><div class="st"><h4>NSDL NET FPI EQUITY FLOW · ${NSDL_DATE}</h4><div><span>${inflow?"Net bought":"Net sold"}</span><b>₹${fmt(flow)} Cr</b></div><div><span>Holdings</span><b>₹${fmt(auc)} Cr</b></div></div></details>`;}

function applyNsdlPaste(txt,manualDate){
  const rawClean=txt.replace(/=\r?\n/g,"").replace(/=3D/g,"=").replace(/<[^>]+>/g," ").replace(/&amp;/g,"&");
  const mHdr=[...rawClean.matchAll(/Net Investment\s+([A-Za-z]+\s+\d{1,2}\s*[–-]\s*\d{1,2},?\s+20\d\d)/gi)];
  const autoDt=mHdr.length?mHdr[mHdr.length-1][1]:"1–15 Nov 2026";
  const dt=(manualDate&&manualDate.trim())?manualDate.trim():autoDt;
  const flat=rawClean.replace(/—/g," 0 ").replace(/–/g,"-").replace(/−/g,"-").replace(/\s+/g," ").replace(/,/g,"").replace(/₹/g,"").replace(/Cr/g,"");
  const secs=Object.keys(NSDL).sort((a,b)=>b.length-a.length),pos=[],occ=[];
  pos.sort((a,b)=>a[0]-b[0]);
  if(pos.length<2){alert("NSDL ડેટા મળ્યો નથી.");return false;}
  const nextData={...NSDL};
  for(let i=0;i<pos.length;i++){
    const [st,en,s]=pos[i],nextSt=i+1<pos.length?pos[i+1][0]:Math.min(flat.length,en+1500);
    const rawTok=flat.slice(en,nextSt).match(/[+-]?\d+(?:\.\d+)?/g)||[];
    let nums=rawTok.map(Number);
    const prevAuc=NSDL[s]?NSDL[s][1]:50000;
    let flow=0,auc=prevAuc,prevFlow=null;
    if(nums.length>=96){nums=nums.slice(0,96);const B=24;prevFlow=nums[B];flow=nums[2*B];auc=nums[3*B]>0?nums[3*B]:prevAuc;}
    else{
      if(nums.length>=4&&nums.length%3===1&&nums[nums.length-1]>=1&&nums[nums.length-1]<=25){nums=nums.slice(0,-1);rawTok.pop();}
      if(nums.length>=15){const B=Math.floor(nums.length/3);flow=nums[B];auc=nums[2*B]>0?nums[2*B]:prevAuc;}
      else if(nums.length>=4){auc=nums[0]>0?nums[0]:prevAuc;flow=(nums[1]===0&&nums[2]!==0)?nums[2]:nums[1];}
      else if(nums.length>=2){const hasSign=/^[+-]/.test(rawTok[0]||"");if(!hasSign&&Math.abs(nums[0])>Math.abs(nums[1])*3){flow=nums[1];auc=nums[0];}else{flow=nums[0];auc=nums[1];}}
      else if(nums.length===1)flow=nums[0];
    }
    nextData[s]=[flow,auc];
    if(NSDL_HISTORY[s]){if(prevFlow!==null)NSDL_HISTORY[s]=[...NSDL_HISTORY[s].slice(-8),prevFlow,flow];else NSDL_HISTORY[s]=[...NSDL_HISTORY[s].slice(-9),flow];}
  }
  NSDL=nextData;NSDL_DATE=dt;FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));
  try{localStorage.setItem("cfm_nsdl_v1",JSON.stringify({source:"paste",date:NSDL_DATE,data:NSDL,history:NSDL_HISTORY}));}catch(e){}
  mode="fpi";render();note("NSDL FPI updated: "+NSDL_DATE+" ("+pos.length+" sectors)");return true;
}

let sm="BUY",mkrTf="D",mkrFresh=true,so=false;
function mkrInfo(x){
  const b=sm==="BUY",isD=mkrTf==="D",sigVal=isD?x.Daily:x.Weekly;if(sigVal!==sm)return null;
  const tRaw=isD?x.DTurnAgo:x.WTurnAgo,cDir=isD?x.DCross:x.WCross,cRaw=isD?x.DCrossAgo:x.WCrossAgo;
  const tAge=(tRaw!==""&&tRaw!=null&&!isNaN(tRaw))?+tRaw:999,cAge=(cDir===(b?"UP":"DN")&&cRaw!==""&&cRaw!=null&&!isNaN(cRaw))?+cRaw:999;
  const minAgo=Math.min(tAge,cAge),R=[],tfLabel=isD?"Daily":"Weekly";
  if(tAge!==999)R.push(`${tfLabel} line ${b?"up":"down"} (${ago(tAge)})`);
  if(cAge!==999)R.push(`${tfLabel} crossed ${b?"above":"below"} line (${ago(cAge)})`);
  if(!R.length)R.push(`${tfLabel} ${sm}`);
  return{R,minAgo};
}

  hideAll("grid");const g={};rows.forEach(r=>{if((cap==="All"||r.Cap===cap)&&!isNaN(r[period]))(g[r.Industry]??=[]).push(r);});
  const secs=Object.entries(g).filter(([,v])=>v.length>=(cap==="All"?3:2)).map(([n,v])=>[n,v,avg(v.map(x=>x[period]))]).sort((a,b)=>a[2]-b[2]);
  const all=view==="all",neg=secs.filter(x=>x[2]<0),pos=secs.filter(x=>x[2]>=0).reverse(),O=all?neg:secs.slice(0,5),I=all?pos:secs.slice(-5).reverse();
  document.getElementById("out").innerHTML=O.map(([n,v],i)=>card(i+1,n,v,false)).join("")||"<div class='note'>None</div>";
  document.getElementById("in").innerHTML=I.map(([n,v],i)=>card(i+1,n,v,true)).join("")||"<div class='note'>None</div>";
  renderShort(Object.values(g).flat());renderSig(Object.values(g).flat(),new Set(I.map(x=>x[0])),new Set(O.map(x=>x[0])));
  const b=bench[period]||0;document.getElementById("sub").textContent=`${PERIODS.find(p=>p[0]===period)[1]} · Nifty 500 ${b>=0?"+":""}${b.toFixed(1)}% · money moved OUT (left) and INTO (right)`;
  document.getElementById("tabs").innerHTML=bar(true);
}

let cur=[];
document.getElementById("tabs").onclick=e=>{const d=e.target.dataset;if(d.p){period=d.p;load(cur)}else if(d.v){view=d.v;render()}else if(d.m){mode=d.m;render()}else if(d.c){cap=d.c;render()}else if(d.s){sig=d.s;render()}};
const note=t=>document.getElementById("note").textContent=t;
function useCSV(text,name){
  if(!/^Symbol,Industry/i.test(text.trim())&&Object.keys(NSDL).some(k=>text.toLowerCase().includes(k.toLowerCase()))){if(applyNsdlPaste(text))return;}
  try{const recs=parseCSV(text);if(!recs.length||!("Industry" in recs[0])||!("1M" in recs[0]))throw 0;cur=recs;load(cur);note("Showing: "+name+" ("+recs.length+" stocks)");}catch(e){note("Could not parse pasted text.");}
}
document.getElementById("f").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>useCSV(t,f.name));};
document.getElementById("pb").onclick=()=>{const w=document.getElementById("pw");w.style.display=w.style.display==="none"?"block":"none";};
document.getElementById("pgo").onclick=()=>useCSV(document.getElementById("ta").value,"pasted data");

render();
fetch("nsdl.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{let hp=false;try{const sv=JSON.parse(localStorage.getItem("cfm_nsdl_v1")||"null");if(sv&&sv.source==="paste")hp=true;}catch(e){}if(hp)return;if(j.data)NSDL=j.data;if(j.date)NSDL_DATE=j.date;if(j.history)NSDL_HISTORY=j.history;FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));render();}).catch(()=>{});
fetch("flow.csv?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{useCSV(t,"flow.csv");note("Live data · updated automatically after market close");}).catch(()=>{note("Could not load flow.csv");});
</script></body></html>
