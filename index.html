function splitCSV(l){const o=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===","&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
function parseCSV(t){
  const clean=t.replace(/^\uFEFF/,"").trim();
  const L=clean.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(!L.length)return[];
  const h=splitCSV(L.shift()).map(x=>x.trim());
  return L.map(l=>{const c=splitCSV(l),o={};h.forEach((k,i)=>o[k]=c[i]?c[i].trim():"");return o;});
}

function buyScore(r,sm){
  let s=0;const R=[];
  if(r.Daily==="BUY"&&r.DConfirmed==="Y"){s+=2;R.push("Daily confirmed BUY")}
  if(r.Weekly==="BUY"&&r.WConfirmed==="Y"){s+=2;R.push("Weekly confirmed BUY")}
  if(!isNaN(r.RSI_D)&&r.RSI_D>40&&r.RSI_D<70){s+=1;R.push("RSI healthy")}
  if(r.RSPos==="Y"){s+=1;R.push("RS+ beating Nifty 500")}
  if(r.RSState==="Rising"){s+=1;R.push("RS rising")}
  if(r.RS_Rank>=80){s+=1;R.push("Top RS Rank ("+r.RS_Rank+"/100)")}
  if(r.DelivHigh==="Y"){s+=1;R.push("high delivery %")}
  const fresh=(r.DTurnAgo!==""&&r.DTurnAgo<=2)||(r.WTurnAgo!==""&&r.WTurnAgo<=1)||(r.DCross==="UP"&&r.DCrossAgo!==""&&r.DCrossAgo<=3);
  if(fresh){s+=1;R.push("fresh signal")}
  if(!isNaN(r["1M"])&&r["1M"]>sm){s+=1;R.push("beats its sector")}
  return{score:s,reasons:R};
}

function wlSet(sym,status,price){try{const w=wlGet();w[sym]={status,price:price||"",added:new Date().toISOString().slice(0,10)};localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist();if(mode==="watchlist")renderWatchlistTab()}
function wlRemove(sym){try{const w=wlGet();delete w[sym];localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist();if(mode==="watchlist")renderWatchlistTab()}
function watchBtns(sym,price){

}

function renderWatchlist(){
  const el=document.getElementById("wl");let w={};try{w=wlGet()}catch(e){}
  const syms=Object.keys(w);
  if(!syms.length){el.style.display="none";return}
  el.style.display="block";
  const lines=syms.map(sym=>{
    const rec=w[sym],r=rows.find(x=>x.Symbol===sym);
    const now=r?r.Price:"",chg=(now&&rec.price)?((now-rec.price)/rec.price*100):null;
    
    // Daily અને Weekly બંને સિગ્નલ કલર-કોડ સાથે
    const dSig = r && r.Daily ? `<span style="color:var(--${r.Daily==="BUY"?"gc":"rc"});font-weight:600">Daily ${r.Daily}${r.DConfirmed==="Y"?" ✓":""}</span>` : "";
    const wSig = r && r.Weekly ? `<span style="color:var(--${r.Weekly==="BUY"?"gc":"rc"});font-weight:600">Weekly ${r.Weekly}${r.WConfirmed==="Y"?" ✓":""}</span>` : "";
    const sig = r ? `${dSig}${dSig && wSig ? " · " : ""}${wSig}` || "mixed/unconfirmed" : "not in current data";
    
    const rsStr=r?` · <span style="font-weight:700;color:var(--${r.RS_Rank>=80?"gc":r.RS_Rank<50?"rc":"fg"})">RS: ${r.RS_Rank}</span>`:"";
    return `<div class="sr"><button data-wlrm="${esc(sym)}" style="float:right;border:none;background:none;color:var(--mut);font-size:16px;padding:0 4px;cursor:pointer">✕</button><b>${esc(sym)}</b> <i class="cp">${rec.status==="bought"?"Bought":"Watching"}</i>${rsStr}<small>${rec.price?"at ₹"+rec.price+" on "+rec.added:"added "+rec.added}${now?" · now ₹"+now:""}${chg!==null?" · <span style=\"color:var(--"+(chg>=0?"gc":"rc")+")\">"+(chg>=0?"+":"")+chg.toFixed(1)+"%</span>":""}</small><small>${sig}</small></div>`;
  }).join("");
  el.innerHTML=`<h3>⭐ My Watchlist</h3><small style="color:var(--mut)">Saved on this device.</small><div class="sl" style="margin-top:8px">${lines}</div>`;
}

function card(i,name,stocks,inflow){
  const m=avg(stocks.map(s=>s[period])),b=bench[period]||0,rel=m-b,beat=stocks.filter(s=>s[period]>b).length;

  <span class="rt"><b>${m>=0?"+":""}${m.toFixed(1)}%</b><span>${rel>=0?"▲ OUT":"▼ UNDER"} Nifty 500 by ${Math.abs(rel).toFixed(1)}%</span></span></summary>

let sm="BUY",so=false;
const ago=n=>n===""||n===undefined||n===null?"":n===0?"today":n===1?"1 bar ago":n+" bars ago";
function why(x){
  const b=sm==="BUY",R=[];
  if(x.DTurnAgo!==""&&x.Daily===(b?"BUY":"SELL"))R.push("Daily line "+(b?"up":"down")+" ("+ago(x.DTurnAgo)+")");
  if(x.DCross===(b?"UP":"DN")&&x.DCrossAgo!=="")R.push("Daily crossed "+(b?"above":"below")+" line ("+ago(x.DCrossAgo)+")");
  if(x.WTurnAgo!==""&&x.Weekly===(b?"BUY":"SELL"))R.push("Weekly line "+(b?"up":"down")+" ("+ago(x.WTurnAgo)+")");
  if(x.WCross===(b?"UP":"DN")&&x.WCrossAgo!=="")R.push("Weekly crossed "+(b?"above":"below")+" line ("+ago(x.WCrossAgo)+")");
  return R;
}

const streakOf=hist=>{
  if(!hist||!hist.length)return"";
  const sign=hist[hist.length-1]>=0;
  let n=0;
  for(let i=hist.length-1;i>=0;i--){
    if((hist[i]>=0)===sign)n++;
    else break;
  }
  return n>=2 ? `${n}x ${sign?"BUY":"SELL"}` : "";
};

  rows.forEach(r=>{if(!isNaN(r["1M"]))(G[r.Industry]??=[]).push(r)});
  const rowsHtml=Object.entries(G).filter(([,v])=>v.length>=2).map(([n,v])=>{
    const m1=avg(v.map(x=>x["1M"]).filter(x=>!isNaN(x))),m3=avg(v.map(x=>x["3M"]).filter(x=>!isNaN(x)));
    const vs3=m3-(bench["3M"]||0),lead1=m1>(bench["1M"]||0),lead3=m3>(bench["3M"]||0);
    const sig=lead1&&lead3?["Leading","gc"]:lead1&&!lead3?["Improving","gc"]:!lead1&&lead3?["Weakening","rc"]:["Lagging","rc"];
    const up=v.filter(x=>x.Daily==="BUY"&&x.DConfirmed==="Y").length,upPct=v.some(x=>x.Daily)?(up/v.length*100):null;
    const hist=NSDL_HISTORY[n],streak=streakOf(hist);
    return{n,v:v.length,vs3,sig,upPct,streak};
  }).sort((a,b)=>b.vs3-a.vs3);

  el.innerHTML=`<h3>Sector Rotation — Relative Strength vs Nifty 500</h3>
  <div style="overflow-x:auto;margin-top:10px"><table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap">
  <tr style="color:var(--mut);text-align:left;border-bottom:1px solid var(--mut)"><th style="padding:6px 10px 6px 0">Sector</th><th style="padding:6px 10px">vs Nifty (3M)</th><th style="padding:6px 10px">Trend</th><th style="padding:6px 10px">% Stocks Daily BUY</th><th style="padding:6px 10px">FPI Streak</th></tr>
  ${rowsHtml.map(r=>`<tr style="border-bottom:1px solid var(--card)"><td style="padding:6px 10px 6px 0"><b>${esc(r.n)}</b><br><small style="color:var(--mut)">${r.v} stocks</small></td>
  <td style="padding:6px 10px;color:var(--${r.vs3>=0?"gc":"rc"})">${r.vs3>=0?"+":""}${r.vs3.toFixed(1)}%</td>
  <td style="padding:6px 10px"><i class="sg ${r.sig[1]==="gc"?"b":"s"}">${r.sig[0]}</i></td>
  <td style="padding:6px 10px">${r.upPct===null?"—":r.upPct.toFixed(0)+"%"}</td>
  <td style="padding:6px 10px;font-weight:700;color:var(--${r.streak.includes("BUY")?"gc":r.streak.includes("SELL")?"rc":"fg"})">${r.streak||"—"}</td></tr>`).join("")}
  </table></div>`;
  document.getElementById("tabs").innerHTML=bar(false);
}

let tcap="All",trs="All";
function renderTrend(){
  hideAll("trend");
  const el=document.getElementById("trend"),q=(document.getElementById("sq").value||"").trim().toLowerCase();
  let list=rows.filter(r=>r.Price);
  if(tcap!=="All")list=list.filter(r=>r.Cap===tcap);
  if(trs==="Rising")list=list.filter(r=>r.RSState==="Rising");
  if(trs==="Falling")list=list.filter(r=>r.RSState==="Falling");
  if(trs==="Breakout")list=list.filter(r=>r.RSPos==="Y");
  if(trs==="RS80")list=list.filter(r=>r.RS_Rank>=80);
  if(q)list=list.filter(r=>r.Symbol.toLowerCase().includes(q)||(r.Industry||"").toLowerCase().includes(q));
  list=list.slice().sort((a,b)=>(b.RS_Rank||50)-(a.RS_Rank||50)||(b.Daily==="BUY")-(a.Daily==="BUY"));
  const cell=v=>v?`<span style="color:var(--${v==="Above"?"gc":"rc"})">${v}</span>`:"—";
  el.innerHTML=`<h3>Trend Scanner (${list.length} stocks)</h3>
  <div class="bar" style="margin:8px 0">${["All",...CAPS].map(c=>`<button class="${c===tcap?"on":""}" data-tc="${c}">${c==="All"?"All caps":c+" cap"}</button>`).join("")}</div>
  <div class="bar" style="margin:0 0 8px">${["All","RS80","Rising","Falling","Breakout"].map(c=>`<button class="${c===trs?"on":""}" data-trs="${c}">${c==="All"?"All RS":c==="RS80"?"RS Rank ≥ 80":c==="Breakout"?"RS+":c}</button>`).join("")}</div>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap">
  <tr style="color:var(--mut);text-align:left;border-bottom:1px solid var(--mut)"><th style="padding:6px 10px 6px 0">Stock</th><th style="padding:6px 10px">RS Rank</th><th style="padding:6px 10px">Sector</th><th style="padding:6px 10px">Price</th><th style="padding:6px 10px">Trend</th><th style="padding:6px 10px">20d</th><th style="padding:6px 10px">50d</th><th style="padding:6px 10px">RSI</th></tr>
  ${list.slice(0,60).map(r=>`<tr style="border-bottom:1px solid var(--card)"><td style="padding:6px 10px 6px 0"><b>${esc(r.Symbol)}</b>${r.Cap?` <i class="cp">${r.Cap}</i>`:""}</td><td style="padding:6px 10px;font-weight:700;color:var(--${r.RS_Rank>=80?"gc":r.RS_Rank<50?"rc":"fg"})">${r.RS_Rank||"—"}</td><td style="padding:6px 10px">${esc(r.Industry||"")}</td><td style="padding:6px 10px">₹${r.Price||"—"}</td><td style="padding:6px 10px"><i class="sg ${r.Daily==="BUY"?"b":"s"}">${r.Daily}</i></td><td style="padding:6px 10px">${cell(r.EMA20)}</td><td style="padding:6px 10px">${cell(r.EMA50)}</td><td style="padding:6px 10px">${r.RSI_D||"—"}</td></tr>`).join("")||"<tr><td colspan=8 style=\"padding:10px 0;color:var(--mut)\">No matching stocks.</td></tr>"}
  </table></div>`;
  document.getElementById("tabs").innerHTML=bar(false);
}

document.getElementById("trend").onclick=e=>{const d=e.target.dataset;if(d.tc){tcap=d.tc;renderTrend()}else if(d.trs){trs=d.trs;renderTrend()}};

let sahilTf="W";
function renderSahil(){
  hideAll("sahil");
  const el=document.getElementById("sahil"),fld=sahilTf==="W"?"SahilW":"SahilD";
  const buys=rows.filter(r=>r[fld]==="BUY"),sells=rows.filter(r=>r[fld]==="SELL");
  el.innerHTML=`<h3>Breakout Scanner (${sahilTf==="W"?"Weekly":"Daily"})</h3>
  <div class="bar" style="margin:8px 0"><button class="${sahilTf==="D"?"on":""}" data-stf="D">Daily</button><button class="${sahilTf==="W"?"on":""}" data-stf="W">Weekly</button></div>
  <div class="grid" style="margin-top:10px">
    <div><h4 style="color:var(--rc)">BREAKDOWN (SELL) — ${sells.length}</h4><div class="sl">${sells.map(r=>`<div class="sr"><b>${esc(r.Symbol)}</b> <span class="cp">RS:${r.RS_Rank}</span> · ₹${r.Price||"—"}</div>`).join("")||"<small>None</small>"}</div></div>
    <div><h4 style="color:var(--gc)">BREAKOUT (BUY) — ${buys.length}</h4><div class="sl">${buys.map(r=>`<div class="sr"><b>${esc(r.Symbol)}</b> <span class="cp" style="font-weight:700">RS:${r.RS_Rank}</span> · ₹${r.Price||"—"}</div>`).join("")||"<small>None</small>"}</div></div>
  </div>`;
  document.getElementById("tabs").innerHTML=bar(false);
}

document.getElementById("sahil").onclick=e=>{const d=e.target.dataset;if(d.stf){sahilTf=d.stf;renderSahil()}};

function render(){
  if(mode==="rotation")return renderRotation();
  if(mode==="trend")return renderTrend();
  if(mode==="sahil")return renderSahil();
  if(mode==="watchlist")return renderWatchlistTab();
  if(mode==="fpi")return renderF();

  hideAll("grid");
  const g={};rows.forEach(r=>{if((cap==="All"||r.Cap===cap)&&!isNaN(r[period]))(g[r.Industry]??=[]).push(r)});
  const secs=Object.entries(g).filter(([,v])=>v.length>=(cap==="All"?3:2)).map(([n,v])=>[n,v,avg(v.map(x=>x[period]))]).sort((a,b)=>a[2]-b[2]);
  const all=view==="all",neg=secs.filter(x=>x[2]<0),pos=secs.filter(x=>x[2]>=0).reverse();
  const O=all?neg:secs.slice(0,5),I=all?pos:secs.slice(-5).reverse();
  document.getElementById("out").innerHTML=O.map(([n,v],i)=>card(i+1,n,v,false)).join("")||"<div class='note'>None</div>";
  document.getElementById("in").innerHTML=I.map(([n,v],i)=>card(i+1,n,v,true)).join("")||"<div class='note'>None</div>";
  renderShort(Object.values(g).flat());
  renderSig(Object.values(g).flat(),new Set(I.map(x=>x[0])));
  const b=bench[period]||0;
  document.getElementById("sub").textContent=`${PERIODS.find(p=>p[0]===period)[1]} · Nifty 500 ${b>=0?"+":""}${b.toFixed(1)}% · money moved OUT (left) and INTO (right)`;
  document.getElementById("tabs").innerHTML=bar(true);
}

let cur=sample();
document.getElementById("tabs").onclick=e=>{
  const d=e.target.dataset;
  if(d.p){period=d.p;load(cur)}
  else if(d.v){view=d.v;render()}
  else if(d.m){mode=d.m;render()}
  else if(d.tc){tcap=d.tc;renderTrend()}
  else if(d.trs){trs=d.trs;renderTrend()}
  else if(d.c){cap=d.c;render()}
  else if(d.s){sig=d.s;render()}
};

const note=t=>document.getElementById("note").textContent=t;
function useCSV(text,name){
  try{
    const recs=parseCSV(text);
    if(!recs.length||!("Industry" in recs[0])||!("1M" in recs[0]))throw 0;
    cur=recs;
    load(cur);
    note("Showing: "+name+" ("+recs.length+" stocks)");
  }catch(e){
    note("Could not parse CSV. Using default system data.");
  }
}

document.getElementById("f").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>useCSV(t,f.name)).catch(()=>note("Could not open file."))};
document.getElementById("pb").onclick=()=>{const w=document.getElementById("pw");w.style.display=w.style.display==="none"?"block":"none"};
document.getElementById("pgo").onclick=()=>useCSV(document.getElementById("ta").value,"pasted data");

try {
  load(cur);
} catch(err) {
  console.error("Init load error:", err);
}

fetch("nsdl.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  if(j.data)NSDL=j.data;
  if(j.date)NSDL_DATE=j.date;
  if(j.history)NSDL_HISTORY=j.history;
  FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));
  render();
}).catch(()=>{});

fetch("flow.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{
  useCSV(t,"flow.csv");
  note("Live data · updated automatically after market close");
}).catch(()=>{});
