<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capital Flow Map — NSE Sectors</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--fg:#1a1d21;--mut:#6b7280;--card:#fff;--rbg:#fdeef1;--rbd:#f2c0cc;--rc:#b0103a;--gbg:#eefaf2;--gbd:#bfe8cf;--gc:#0a7a3d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#e8eaed;--mut:#9aa0a6;--card:#1a1e24;--rbg:#2a1519;--rbd:#5a2530;--rc:#ff6b8b;--gbg:#122318;--gbd:#24503a;--gc:#4ade80}}
:root[data-theme="dark"]{--bg:#111418;--fg:#e8eaed;--mut:#9aa0a6;--card:#1a1e24;--rbg:#2a1519;--rbd:#5a2530;--rc:#ff6b8b;--gbg:#122318;--gbd:#24503a;--gc:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:auto;padding:16px}
h1{font-size:14px;letter-spacing:.14em;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:var(--mut);font-size:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.bar button,.bar label{border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;transition:all 0.15s ease}
.bar button.on{background:var(--fg);color:var(--bg);font-weight:600}
.note{background:var(--card);border:1px dashed var(--mut);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mut);margin-bottom:14px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.hd{border-radius:10px;padding:12px;margin-bottom:10px;font-weight:700}
.out .hd,.out details{background:var(--rbg);border:1px solid var(--rbd)}.in .hd,.in details{background:var(--gbg);border:1px solid var(--gbd)}
.out{--c:var(--rc);--b:var(--rbd)}.in{--c:var(--gc);--b:var(--gbd)}.hd{color:var(--c)}.hd small{font-weight:400;color:var(--mut);margin-left:6px}
details{border-radius:10px;padding:12px 14px;margin-bottom:10px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}summary::-webkit-details-marker{display:none}
.rk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.nm{flex:1;min-width:0}.nm b{font-size:15px}.nm span{display:block;font-size:11px;color:var(--mut)}
.rt{text-align:right;color:var(--c)}.rt b{font-size:20px;display:block}.rt span{font-size:11px}
.st{margin-top:10px;border-top:1px solid var(--b);padding-top:8px}.st h4{margin:0 0 4px;font-size:10px;letter-spacing:.06em;color:var(--mut)}
.st div{display:flex;justify-content:space-between;padding:3px 0}.st b{color:var(--c)}.sc{max-height:240px;overflow-y:auto}
.pn{background:var(--card);border:1px solid var(--mut);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.pn h3{margin:0 0 8px;font-size:14px}.pn .bar{margin:6px 0 10px;justify-content:flex-start}.pn .bar button{padding:4px 12px;font-size:12px}
.sl{max-height:300px;overflow-y:auto}.sr{padding:7px 0;border-top:1px solid var(--mut)}.sr b{font-size:14px}.sr small{display:block;color:var(--mut);font-size:11px}.sr .r{float:right;font-weight:700}
.sg{font-style:normal;font-size:10px;font-weight:600;border:1px solid;border-radius:8px;padding:1px 6px;margin-right:4px;display:inline-block}
.sg.b{color:var(--gc);border-color:var(--gbd);background:var(--gbg)}.sg.s{color:var(--rc);border-color:var(--rbd);background:var(--rbg)}
.cp{font-style:normal;font-size:9px;border:1px solid var(--mut);color:var(--mut);border-radius:8px;padding:0 5px;margin-left:4px}
</style>
</head>
<body>
<main>
<h1>CAPITAL FLOW MAP</h1>
<div class="sub" id="sub"></div>
<section id="top5" class="pn" style="display:none"></section>
<section id="wl" class="pn" style="display:none"></section>
<div class="bar"><button id="simpleBtn">🎯 Simple Mode</button></div>

<div id="advWrap">
<div class="bar" style="margin-bottom:8px">
  <input id="sq" type="text" placeholder="🔍 Search stock or sector..." style="flex:1;min-width:200px;border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px;font-size:14px">
</div>
<div id="sres" class="pn" style="display:none"></div>

<div class="bar" id="tabs"></div>

<div class="bar">
  <label style="position:relative;overflow:hidden">📂 Load my data (CSV)<input id="f" type="file" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer"></label>
  <button id="pb">📋 Paste CSV instead</button>
</div>
<div id="pw" style="display:none;margin-bottom:14px">
  <textarea id="ta" rows="6" style="width:100%;border:1px solid var(--mut);border-radius:8px;background:var(--card);color:var(--fg);padding:8px;font:12px monospace" placeholder="Open flow.csv, select all, copy, and paste the full text here"></textarea>
  <div class="bar" style="margin-top:8px"><button id="pgo">Load pasted data</button></div>
</div>

<div class="note" id="note">FPI Flows live from NSDL. Select any tab above to switch views.</div>

<section id="short" class="pn"></section>
<section id="sigp" class="pn"></section>
<section id="rot" class="pn" style="display:none;overflow-x:auto"></section>
<section id="trend" class="pn" style="display:none"></section>
<section id="sahil" class="pn" style="display:none"></section>

<div class="grid" id="mainGrid">
  <section class="out"><div class="hd">🔴 MONEY FLOWING OUT<small>investors selling</small></div><div id="out"></div></section>
  <section class="in"><div class="hd">🟢 MONEY FLOWING IN<small>investors buying</small></div><div id="in"></div></section>
</div>
</div>
</main>

<script>
const PERIODS=[["1W","1 Week"],["1M","1 Month"],["3M","3 Months"],["6M","6 Months"]];
let sig="All",cap="All",mode="price",view="top",period="1M",rows=[],bench={};

// 10 Fortnight real flows for accurate FPI Streaks (6x BUY, 7x SELL, etc.)
let NSDL_HISTORY={
  "Healthcare":[-2445,-418,601,-4501,1435,4101,3654,2910,3021,2114],
  "Construction":[2199,-991,-220,-603,3484,403,-1602,-404,442,930],
  "Services":[-362,7019,185,302,2592,2405,-1,590,1193,905],
  "Consumer Services":[-2434,-365,-1630,-1852,3081,7361,2840,3398,5019,422],
  "Chemicals":[-121,-700,90,-773,-514,-114,532,315,543,228],
  "Power":[4956,-1157,476,-2577,-3743,-1267,-1596,-1164,-389,-1653],
  "Telecommunication":[-1908,-2542,2127,373,-720,-2454,-3271,-3322,-1661,-991],
  "Fast Moving Consumer Goods":[-229,-1625,-1936,-5063,-474,-1106,478,-189,-1727,-2029],
  "Automobile and Auto Components":[-1775,-357,-2175,-9044,-1324,-6936,2372,4405,-1299,-2670],
  "Oil, Gas & Consumable Fuels":[-3351,-6885,-2093,-10488,-2789,258,-513,490,-2251,-2385],
  "Information Technology":[-2887,-1643,-268,-6733,-733,60,3298,2530,1573,-960],
  "Financial Services":[-11704,-17960,-5181,-11263,14634,1975,-2869,6535,3959,-6204],
  "Metals & Mining":[2416,1698,4999,-4722,-4371,5993,-1056,720,1087,-681],
  "Consumer Durables":[441,-1162,-287,-634,2564,2384,4958,1472,2431,-397],
  "Capital Goods":[4667,2645,154,-2586,-1442,-2657,-3618,-1556,2162,-108],
  "Realty":[-206,-430,30,-1093,1893,2072,-279,-1014,420,-762]
};
let NSDL_DATE="1–15 Oct 2026";
let NSDL={
  "Information Technology":[2599,398397],"Services":[262,186896],"Media, Entertainment & Publication":[252,11084],
  "Diversified":[43,3626],"Chemicals":[41,119343],"Utilities":[-34,2725],"Forest Materials":[-50,1176],
  "Textiles":[-59,21265],"Construction Materials":[-564,94263],"Realty":[-578,111753],
  "Consumer Durables":[-586,179333],"Construction":[-1224,112879],"Power":[-1732,235832],
  "Consumer Services":[-1931,287273],"Oil, Gas & Consumable Fuels":[-3680,429974],"Metals & Mining":[-3693,263323],
  "Capital Goods":[-3886,476822],"Telecommunication":[-3928,343057],"Healthcare":[-5497,504679],
  "Automobile and Auto Components":[-6533,477593],"Fast Moving Consumer Goods":[-8172,268394],"Financial Services":[-8634,2035663]
};
let FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));

const SAMPLE={
  "Automobile and Auto Components":"MARUTI,M&M,BAJAJ-AUTO|TVSMOTOR,ASHOKLEY,BALKRISIND|SANSERA,GABRIEL,SUBROS|JAMNAAUTO,SUPRAJIT",
  "Capital Goods":"SIEMENS,ABB,HAL|CUMMINSIND,BHEL,POLYCAB|KIRLOSENG,GRSE,TEGA|WENDT,ELECON",
  "Chemicals":"PIDILITIND,SRF,UPL|DEEPAKNTR,TATACHEM,AARTIIND|NEOGEN,FINEORG,CLEAN|BODALCHEM,ANDHRAPET",
  "Construction":"LT,NBCC,IRB|KEC,NCC,RVNL|PNCINFRA,HGINFRA,KALPATARU|ASHOKA,GPTINFRA",
  "Fast Moving Consumer Goods":"ITC,HINDUNILVR,NESTLEIND|BRITANNIA,DABUR,COLPAL|EMAMILTD,BIKAJI,GILLETTE|HERITGFOOD,TASTYBITE",
  "Financial Services":"HDFCBANK,ICICIBANK,SBIN|AUBANK,FEDERALBNK,MUTHOOTFIN|CREDITACC,UJJIVANSFB,CDSL|MANAPPURAM,GEOJITFSL",
  "Healthcare":"SUNPHARMA,CIPLA,DRREDDY|LUPIN,ALKEM,AUROPHARMA|GRANULES,JBCHEPHARM,LAURUSLABS|NATCOPHARM,ORCHPHARMA",
  "Information Technology":"TCS,INFY,HCLTECH|PERSISTENT,COFORGE,MPHASIS|SONATSOFTW,ZENSARTECH,BSOFT|DATAMATICS,CIGNITITEC"
};
const CAPS=["Large","Mid","Small","Micro"];

function seeded(s){return()=>(s=Math.imul(s^s>>>15,1|s),s=s+Math.imul(s^s>>>7,61|s)^s,((s^s>>>14)>>>0)/4294967296)}
function sample(){
  const r=seeded(7),out=[];
  for(const [ind,txt] of Object.entries(SAMPLE)){
    const base=(r()-.5)*16;
    txt.split("|").forEach((grp,ci)=>grp.split(",").forEach(sym=>{
      const isUp=r()>0.45;
      const px=+(120+r()*2800).toFixed(1);
      const o={
        Symbol:sym,Industry:ind,Cap:CAPS[ci],Price:px,
        Daily:isUp?"BUY":"SELL",Weekly:isUp?"BUY":"SELL",DConfirmed:"Y",WConfirmed:"Y",
        EMA20:isUp?"Above":"Below",EMA50:isUp?"Above":"Below",EMA100:isUp?"Above":"Below",EMA200:isUp?"Above":"Below",
        RSState:isUp?"Rising":"Falling",RSPos:isUp?"Y":"N",DelivPct:Math.floor(32+r()*45),
        RSI_D:Math.floor(38+r()*32),RSI_W:Math.floor(42+r()*28),RSI_M:52,
        SahilD:isUp?"BUY":"SELL",SahilDAgo:Math.floor(r()*4),SahilW:isUp?"BUY":"SELL",SahilWAgo:Math.floor(r()*4)
      };
      for(const [p,m] of [["1W",.4],["1M",1],["3M",2.2],["6M",3.5]]) o[p]=+(base*m+(r()-.5)*10*m*(1+ci*.5)).toFixed(1);
      out.push(o);
    }))
  }
  return out;
}

const capOf=v=>/micro/i.test(v||"")?"Micro":/mid/i.test(v||"")?"Mid":/small/i.test(v||"")?"Small":/large/i.test(v||"")?"Large":"";
function splitCSV(l){const o=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===","&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
function parseCSV(t){const L=t.replace(/^\uFEFF/,"").trim().split(/\r?\n/),h=splitCSV(L.shift()).map(x=>x.trim());
 return L.filter(l=>l.trim()).map(l=>{const c=splitCSV(l),o={};h.forEach((k,i)=>o[k]=c[i]?.trim());return o})}
const canon=x=>{const n=(x||"").replace(/,/g,"").trim();return Object.keys(NSDL).find(k=>k.replace(/,/g,"")===n)||(x||"").trim()};

function load(recs){
  bench={};rows=[];
  for(const r of recs){
    const o={
      Symbol:r.Symbol||"?",Industry:canon(r.Industry),Cap:capOf(r.Cap),
      Daily:(r.Daily||"").toUpperCase(),Weekly:(r.Weekly||"").toUpperCase(),
      DTurnAgo:r.DTurnAgo!==""&&r.DTurnAgo!==undefined?+r.DTurnAgo:"",
      WTurnAgo:r.WTurnAgo!==""&&r.WTurnAgo!==undefined?+r.WTurnAgo:"",
      DCrossAgo:r.DCrossAgo!==""&&r.DCrossAgo!==undefined?+r.DCrossAgo:"",
      DCross:(r.DCross||"").toUpperCase(),
      WCrossAgo:r.WCrossAgo!==""&&r.WCrossAgo!==undefined?+r.WCrossAgo:"",
      WCross:(r.WCross||"").toUpperCase(),
      Price:parseFloat(r.Price)||"",EMA20:r.EMA20||"",EMA50:r.EMA50||"",EMA100:r.EMA100||"",EMA200:r.EMA200||"",
      RSState:r.RSState||"",RSCrossAgo:r.RSCrossAgo!==""&&r.RSCrossAgo!==undefined?+r.RSCrossAgo:"",
      RSCross:(r.RSCross||"").toUpperCase(),RSPos:(r.RSPos||"").toUpperCase(),
      DelivPct:parseFloat(r.DelivPct)||"",DelivHigh:(r.DelivHigh||"").toUpperCase(),
      RSI_D:parseFloat(r.RSI_D),RSI_W:parseFloat(r.RSI_W),RSI_M:parseFloat(r.RSI_M),
      RSI40CrossAgo:r.RSI40CrossAgo!==""&&r.RSI40CrossAgo!==undefined?+r.RSI40CrossAgo:"",
      RSI40Cross:(r.RSI40Cross||"").toUpperCase(),
      RSI50CrossAgo:r.RSI50CrossAgo!==""&&r.RSI50CrossAgo!==undefined?+r.RSI50CrossAgo:"",
      RSI50Cross:(r.RSI50Cross||"").toUpperCase(),
      RSI60CrossAgo:r.RSI60CrossAgo!==""&&r.RSI60CrossAgo!==undefined?+r.RSI60CrossAgo:"",
      RSI60Cross:(r.RSI60Cross||"").toUpperCase(),
      DConfirmed:(r.DConfirmed||"").toUpperCase(),WConfirmed:(r.WConfirmed||"").toUpperCase(),
      DLine:parseFloat(r.DLine),DUpper:parseFloat(r.DUpper),DLower:parseFloat(r.DLower),
      WLine:parseFloat(r.WLine),WUpper:parseFloat(r.WUpper),WLower:parseFloat(r.WLower),
      SahilD:(r.SahilD||"").toUpperCase(),SahilDAgo:r.SahilDAgo!==""&&r.SahilDAgo!==undefined?+r.SahilDAgo:"",
      SahilW:(r.SahilW||"").toUpperCase(),SahilWAgo:r.SahilWAgo!==""&&r.SahilWAgo!==undefined?+r.SahilWAgo:""
    };
    PERIODS.forEach(([p])=>o[p]=parseFloat(r[p]));
    if(/^NIFTY ?500$/i.test(o.Symbol)) PERIODS.forEach(([p])=>bench[p]=o[p]);
    else if(o.Industry&&!isNaN(o[period])) rows.push(o);
  }
  PERIODS.forEach(([p])=>{
    if(bench[p]==null){
      const v=rows.map(x=>x[p]).filter(x=>!isNaN(x));
      bench[p]=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;
    }
  });
  renderTop5();
  render();
}

function buyScore(r,sm){
  let s=0;const R=[];
  if(r.Daily==="BUY"&&r.DConfirmed==="Y"){s+=2;R.push("Daily confirmed BUY")}
  if(r.Weekly==="BUY"&&r.WConfirmed==="Y"){s+=2;R.push("Weekly confirmed BUY")}
  if(!isNaN(r.RSI_D)&&r.RSI_D>40&&r.RSI_D<70){s+=1;R.push("RSI healthy")}
  if(r.RSPos==="Y"){s+=1;R.push("RS+ vs Nifty")}
  return{score:s,reasons:R};
}
function slTarget(r){if(isNaN(r.DLine))return null;return{sl:r.DLower,target:r.DUpper,line:r.DLine,extended:!isNaN(r.DUpper)&&r.Price>r.DUpper}}
function wlGet(){try{return JSON.parse(localStorage.getItem("cfm_watchlist_v1")||"{}")}catch(e){return{}}}
function wlSet(sym,status,price){try{const w=wlGet();w[sym]={status,price:price||"",added:new Date().toISOString().slice(0,10)};localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist()}
function wlRemove(sym){try{const w=wlGet();delete w[sym];localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist()}
function watchBtns(sym,price){let st="";try{st=(wlGet()[sym]||{}).status||""}catch(e){}return `<button data-wl="watch" data-sym="${esc(sym)}" data-px="${price||""}" style="padding:3px 8px;font-size:10px;border-radius:10px;border:1px solid var(--mut);background:${st==="watch"?"var(--fg)":"var(--card)"};color:${st==="watch"?"var(--bg)":"var(--fg)"}">${st==="watch"?"★ Watching":"☆ Watch"}</button>`}

function renderWatchlist(){
  const el=document.getElementById("wl");let w={};try{w=wlGet()}catch(e){}
  const syms=Object.keys(w);if(!syms.length){el.style.display="none";return}
  el.style.display="block";
  el.innerHTML=`<h3>⭐ My Watchlist</h3><div class="sl">${syms.map(sym=>`<div class="sr"><b>${esc(sym)}</b> <button data-wlrm="${esc(sym)}" style="float:right;border:none;background:none;color:var(--mut);cursor:pointer">✕</button></div>`).join("")}</div>`;
}

document.addEventListener("click",e=>{
  const d=e.target.dataset;
  if(d.wl) wlSet(d.sym,d.wl,parseFloat(d.px)||"");
  else if(d.wlrm) wlRemove(d.wlrm);
});

let simpleMode=false;
document.getElementById("simpleBtn").onclick=()=>{
  simpleMode=!simpleMode;
  document.getElementById("advWrap").style.display=simpleMode?"none":"block";
  document.getElementById("simpleBtn").textContent=simpleMode?"🔍 Advanced Mode":"🎯 Simple Mode";
};

function renderTop5(){
  const el=document.getElementById("top5");if(!rows.length){el.style.display="none";return}
  el.style.display="block";
  const picks=rows.filter(r=>r.Daily==="BUY"&&r.Weekly==="BUY").slice(0,5);
  el.innerHTML=`<h3>🎯 Today's Top Picks</h3><div class="sl">${picks.map((r,i)=>`<div class="sr"><span class="r" style="color:var(--gc)">BUY</span><b>${i+1}. ${esc(r.Symbol)}</b> <small>${esc(r.Industry)} · ₹${r.Price}</small></div>`).join("")}</div>`;
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const fmt=n=>Math.abs(n).toLocaleString("en-IN");

function card(i,name,stocks,inflow){
  const m=avg(stocks.map(s=>s[period])),b=bench[period]||0,rel=m-b;
  return `<details><summary><span class="rk">${i}</span><span class="nm"><b>${esc(name)}</b><span>${stocks.length} stocks</span></span><span class="rt"><b>${m>=0?"+":""}${m.toFixed(1)}%</b><span>${rel>=0?"▲ OUT":"▼ UNDER"} by ${Math.abs(rel).toFixed(1)}%</span></span></summary><div class="st"><div class="sc">${stocks.map(s=>`<div><span>${esc(s.Symbol)}</span><b>${s[period]>=0?"+":""}${s[period].toFixed(1)}%</b></div>`).join("")}</div></div></details>`;
}

function cardF(i,name,flow,auc,inflow){
  return `<details><summary><span class="rk">${i}</span><span class="nm"><b>${esc(name)}</b><span>FPI ₹${fmt(auc)} Cr</span></span><span class="rt"><b>${flow>=0?"+":"−"}₹${fmt(flow)} Cr</b><span>${(flow/auc*100).toFixed(2)}%</span></span></summary><div class="st"><div><span>${inflow?"Net bought":"Net sold"}</span><b>₹${fmt(flow)} Cr</b></div></div></details>`;
}

function hideAll(except){
  ["short","sigp","rot","trend","sahil","mainGrid"].forEach(id=>{
    const e=document.getElementById(id);
    if(e) e.style.display=(id===except||(except==="grid"&&id==="mainGrid"))?"block":"none";
  });
  if(except==="grid") document.getElementById("mainGrid").style.display="grid";
}

const streakOf=hist=>{
  if(!hist||!hist.length) return "-";
  const sign=hist[hist.length-1]>=0;
  let n=0;
  for(let i=hist.length-1;i>=0;i--){
    if((hist[i]>=0)===sign) n++;
    else break;
  }
  return n>=2 ? `${n}x ${sign?"BUY":"SELL"}` : "-";
};

function renderRotation(){
  hideAll("rot");
  const el=document.getElementById("rot"),G={};
  rows.forEach(r=>{if(!isNaN(r["1M"]))(G[r.Industry]??=[]).push(r)});
  const rowsHtml=Object.entries(G).map(([n,v])=>{
    const m1=avg(v.map(x=>x["1M"]).filter(x=>!isNaN(x))),m3=avg(v.map(x=>x["3M"]).filter(x=>!isNaN(x)));
    const vs3=m3-(bench["3M"]||0),lead1=m1>(bench["1M"]||0),lead3=m3>(bench["3M"]||0);
    const sig=lead1&&lead3?["Leading","gc"]:lead1&&!lead3?["Improving","gc"]:!lead1&&lead3?["Weakening","rc"]:["Lagging","rc"];
    const up=v.filter(x=>x.Daily==="BUY").length,upPct=v.length?(up/v.length*100):0;
    const hist=NSDL_HISTORY[n],streak=streakOf(hist);
    return{n,v:v.length,vs3,sig,upPct,streak};
  }).sort((a,b)=>b.vs3-a.vs3);

  el.innerHTML=`<h3>Sector Rotation — Relative Strength vs Nifty 500</h3>
  <div style="overflow-x:auto;margin-top:10px"><table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap">
  <tr style="color:var(--mut);text-align:left;border-bottom:1px solid var(--mut)"><th style="padding:6px 10px 6px 0">Sector</th><th style="padding:6px 10px">vs Nifty (3M)</th><th style="padding:6px 10px">Signal</th><th style="padding:6px 10px">% Stocks in Uptrend</th><th style="padding:6px 10px">FPI Streak</th></tr>
  ${rowsHtml.map(r=>`<tr style="border-bottom:1px solid var(--card)"><td style="padding:6px 10px 6px 0"><b>${esc(r.n)}</b><br><small style="color:var(--mut)">${r.v} stocks</small></td>
  <td style="padding:6px 10px;color:var(--${r.vs3>=0?"gc":"rc"})">${r.vs3>=0?"+":""}${r.vs3.toFixed(1)}%</td>
  <td style="padding:6px 10px"><i class="sg ${r.sig[1]==="gc"?"b":"s"}">${r.sig[0]}</i></td>
  <td style="padding:6px 10px">${r.upPct.toFixed(0)}%</td>
  <td style="padding:6px 10px;font-weight:700;color:var(--${r.streak.includes("BUY")?"gc":r.streak.includes("SELL")?"rc":"fg"})">${r.streak}</td></tr>`).join("")}
  </table></div>`;
  document.getElementById("tabs").innerHTML=bar(false);
}

function renderTrend(){
  hideAll("trend");
  const el=document.getElementById("trend");
  let list=rows.filter(r=>r.Price);
  const cell=v=>v?`<span style="color:var(--${v==="Above"?"gc":"rc"})">${v}</span>`:"—";
  el.innerHTML=`<h3>Trend Scanner (${list.length} stocks)</h3>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap">
  <tr style="color:var(--mut);text-align:left;border-bottom:1px solid var(--mut)"><th style="padding:6px 10px 6px 0">Stock</th><th style="padding:6px 10px">Sector</th><th style="padding:6px 10px">Price</th><th style="padding:6px 10px">Trend</th><th style="padding:6px 10px">20 EMA</th><th style="padding:6px 10px">50 EMA</th><th style="padding:6px 10px">RSI</th></tr>
  ${list.slice(0,60).map(r=>`<tr style="border-bottom:1px solid var(--card)"><td style="padding:6px 10px 6px 0"><b>${esc(r.Symbol)}</b></td><td style="padding:6px 10px">${esc(r.Industry)}</td><td style="padding:6px 10px">₹${r.Price}</td><td style="padding:6px 10px"><i class="sg ${r.Daily==="BUY"?"b":"s"}">${r.Daily}</i></td><td style="padding:6px 10px">${cell(r.EMA20)}</td><td style="padding:6px 10px">${cell(r.EMA50)}</td><td style="padding:6px 10px">${r.RSI_D||"—"}</td></tr>`).join("")}
  </table></div>`;
  document.getElementById("tabs").innerHTML=bar(false);
}

function renderSahil(){
  hideAll("sahil");
  const el=document.getElementById("sahil");
  const buys=rows.filter(r=>r.SahilD==="BUY"),sells=rows.filter(r=>r.SahilD==="SELL");
  el.innerHTML=`<h3>Breakout Scanner</h3>
  <div class="grid" style="margin-top:10px">
  <div><h4 style="color:var(--rc)">BREAKDOWN (SELL) — ${sells.length}</h4><div class="sl">${sells.map(r=>`<div class="sr"><b>${esc(r.Symbol)}</b> · ₹${r.Price}</div>`).join("")}</div></div>
  <div><h4 style="color:var(--gc)">BREAKOUT (BUY) — ${buys.length}</h4><div class="sl">${buys.map(r=>`<div class="sr"><b>${esc(r.Symbol)}</b> · ₹${r.Price}</div>`).join("")}</div></div>
  </div>`;
  document.getElementById("tabs").innerHTML=bar(false);
}

function renderF(){
  hideAll("grid");
  const secs=Object.entries(NSDL).sort((a,b)=>a[1][0]-b[1][0]),neg=secs.filter(x=>x[1][0]<0),pos=secs.filter(x=>x[1][0]>=0).reverse();
  document.getElementById("out").innerHTML=neg.map(([n,v],i)=>cardF(i+1,n,v[0],v[1],false)).join("");
  document.getElementById("in").innerHTML=pos.map(([n,v],i)=>cardF(i+1,n,v[0],v[1],true)).join("");
  const t=secs.reduce((a,x)=>a+x[1][0],0);
  document.getElementById("sub").textContent=`FPI net equity flow · ${NSDL_DATE} · all sectors ${t>=0?"+":"−"}₹${fmt(t)} Cr · source: NSDL`;
  document.getElementById("tabs").innerHTML=bar(false);
}

function bar(showP){
  return `<button class="${mode==="price"?"on":""}" data-m="price">Price return</button>
  <button class="${mode==="fpi"?"on":""}" data-m="fpi">FPI net flow (NSDL)</button>
  <button class="${mode==="rotation"?"on":""}" data-m="rotation">Sector Rotation</button>
  <button class="${mode==="trend"?"on":""}" data-m="trend">Trend Scanner</button>
  <button class="${mode==="sahil"?"on":""}" data-m="sahil">Breakout Scanner</button>`+
  (showP?PERIODS.map(([p,l])=>`<button class="${p===period?"on":""}" data-p="${p}">${l}</button>`).join(""):"");
}

function render(){
  if(mode==="rotation") return renderRotation();
  if(mode==="trend") return renderTrend();
  if(mode==="sahil") return renderSahil();
  if(mode==="fpi") return renderF();
  
  hideAll("grid");
  const g={};rows.forEach(r=>{(g[r.Industry]??=[]).push(r)});
  const secs=Object.entries(g).map(([n,v])=>[n,v,avg(v.map(x=>x[period]))]).sort((a,b)=>a[2]-b[2]);
  const neg=secs.filter(x=>x[2]<0),pos=secs.filter(x=>x[2]>=0).reverse();
  document.getElementById("out").innerHTML=neg.map(([n,v],i)=>card(i+1,n,v,false)).join("");
  document.getElementById("in").innerHTML=pos.map(([n,v],i)=>card(i+1,n,v,true)).join("");
  const b=bench[period]||0;
  document.getElementById("sub").textContent=`${PERIODS.find(p=>p[0]===period)[1]} · Nifty 500 ${b>=0?"+":""}${b.toFixed(1)}% · money moved OUT of sectors (left) and INTO sectors (right)`;
  document.getElementById("tabs").innerHTML=bar(true);
}

document.getElementById("tabs").onclick=e=>{
  const d=e.target.dataset;
  if(d.m){mode=d.m;render()}
  else if(d.p){period=d.p;load(cur)}
};

cur=sample();
load(cur);

fetch("nsdl.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  if(j.data) NSDL=j.data;
  if(j.date) NSDL_DATE=j.date;
  if(j.history) NSDL_HISTORY=j.history;
  FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));
  render();
}).catch(()=>{});

fetch("flow.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{
  useCSV(t,"flow.csv");
  note("Live data · updated automatically");
}).catch(()=>{});
</script>
</body>
</html>
