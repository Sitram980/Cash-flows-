*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:16px}h1{font-size:13px;letter-spacing:.14em;text-align:center;margin:8px 0 2px}

.hd{border-radius:10px;padding:12px;margin-bottom:10px;font-weight:700}
.out .hd,.out details{background:var(--rbg);border:1px solid var(--rbd)}.in .hd,.in details{background:var(--gbg);border:1px solid var(--gbd)}
.out{--c:var(--rc);--b:var(--rbd)}.in{--c:var(--gc);--b:var(--gbd)}.hd{color:var(--c)}.hd small{font-weight:400;color:var(--mut);margin-left:6px}
details{border-radius:10px;padding:12px 14px;margin-bottom:10px}summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}summary::-webkit-details-marker{display:none}
.rk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}

</style></head><body><main>

<script>window.onerror=function(m,u,l){var n=document.getElementById("note");if(n)n.textContent="JS Error: "+m+" (line "+l+")";};</script>
<script>
const PERIODS=[["1W","1 Week"],["1M","1 Month"],["3M","3 Months"],["6M","6 Months"]],CAPS=["Large","Mid","Small","Micro"];
let sig="All",cap="All",mode="price",view="top",period="1M",rows=[],bench={};
const SAMPLE={"Automobile and Auto Components":"MARUTI,M&M,BAJAJ-AUTO|TVSMOTOR,ASHOKLEY","Capital Goods":"SIEMENS,ABB,HAL|CUMMINSIND,BHEL,POLYCAB,APARINDS","Chemicals":"PIDILITIND,SRF,UPL|DEEPAKNTR,TATACHEM","Construction":"LT,NBCC,IRB|KEC,RVNL","Construction Materials":"ULTRACEMCO,AMBUJACEM|DALBHARAT,JKCEMENT","Consumer Durables":"TITAN,HAVELLS,DIXON|VOLTAS,CROMPTON","Consumer Services":"TRENT,DMART,INDHOTEL|NYKAA,JUBLFOOD","Diversified":"3MINDIA,GODREJIND|HINDCOPPER,DCMSHRIRAM","Fast Moving Consumer Goods":"ITC,HINDUNILVR,NESTLEIND|BRITANNIA,DABUR","Financial Services":"HDFCBANK,ICICIBANK,SBIN|AUBANK,FEDERALBNK","Forest Materials":"CENTURYPLY|GREENPANEL,GREENPLY","Healthcare":"SUNPHARMA,CIPLA,DRREDDY|LUPIN,ALKEM","Information Technology":"TCS,INFY,HCLTECH|PERSISTENT,COFORGE","Media, Entertainment & Publication":"ZEEL,SUNTV,PVRINOX|SAREGAMA,NAZARA","Metals & Mining":"TATASTEEL,JSWSTEEL,HINDALCO|VEDL,NMDC","Oil, Gas & Consumable Fuels":"RELIANCE,ONGC,BPCL|IOC,GAIL","Power":"NTPC,POWERGRID,TATAPOWER|ADANIPOWER,JSWENERGY","Realty":"DLF,GODREJPROP,LODHA|OBEROIRLTY,PRESTIGE","Services":"ADANIPORTS,INDIGO|IRCTC,CONCOR","Telecommunication":"BHARTIARTL,INDUSTOWER|IDEA,TATACOMM","Textiles":"PAGEIND|KPRMILL,TRIDENT","Utilities":"ADANIGREEN,ADANIENSOL|NHPC,SUZLON","ETFs":"NIFTYBEES,JUNIORBEES,BANKBEES,ITBEES|GOLDBEES,SILVERBEES,MON100"};
let NSDL_HISTORY={"Healthcare":[-2445,-418,601,-4501,1435,4101,3654,2910,3021,2114],"Power":[4956,-1157,476,-2577,-3743,-1267,-1596,-1164,-389,-1653],"Telecommunication":[-1908,-2542,2127,373,-720,-2454,-3271,-3322,-1661,-991],"Consumer Services":[-2434,-365,-1630,-1852,3081,7361,2840,3398,5019,422],"Chemicals":[-121,-700,90,-773,-514,-114,532,315,543,228],"Fast Moving Consumer Goods":[-229,-1625,-1936,-5063,-474,-1106,478,-189,-1727,-2029],"Automobile and Auto Components":[-1775,-357,-2175,-9044,-1324,-6936,2372,4405,-1299,-2670],"Construction Materials":[-670,-1207,-434,-2426,-650,1574,871,384,-250,-358],"Construction":[2199,-991,-220,-603,3484,403,-1602,-404,442,930],"Services":[-362,7019,185,302,2592,2405,-1,590,1193,905],"Oil, Gas & Consumable Fuels":[-3351,-6885,-2093,-10488,-2789,258,-513,490,-2251,-2385],"Diversified":[3,33,-14,-13,7,29,-1,-18,-4,-23],"Information Technology":[-2887,-1643,-268,-6733,-733,60,3298,2530,1573,-960],"Financial Services":[-11704,-17960,-5181,-11263,14634,1975,-2869,6535,3959,-6204],"Metals & Mining":[2416,1698,4999,-4722,-4371,5993,-1056,720,1087,-681],"Consumer Durables":[441,-1162,-287,-634,2564,2384,4958,1472,2431,-397],"Capital Goods":[4667,2645,154,-2586,-1442,-2657,-3618,-1556,2162,-108],"Realty":[-206,-430,30,-1093,1893,2072,-279,-1014,420,-762],"Utilities":[-12,-28,-19,7,216,119,-163,7,-38,194],"Textiles":[-48,-112,39,-146,241,248,206,1,-294,10],"Forest Materials":[73,-41,1,-12,-12,-11,40,-9,-7,7],"Media, Entertainment & Publication":[-149,-12,-110,-232,-127,-289,24,-6,72,-93]};
let NSDL_DATE="16–31 Oct 2026";
let NSDL={"Information Technology":[2599,398397],"Services":[262,186896],"Media, Entertainment & Publication":[252,11084],"Diversified":[43,3626],"Chemicals":[41,119343],"Utilities":[-34,2725],"Forest Materials":[-50,1176],"Textiles":[-59,21265],"Construction Materials":[-564,94263],"Realty":[-578,111753],"Consumer Durables":[-586,179333],"Construction":[-1224,112879],"Power":[-1732,235832],"Consumer Services":[-1931,287273],"Oil, Gas & Consumable Fuels":[-3680,429974],"Metals & Mining":[-3693,263323],"Capital Goods":[-3886,476822],"Telecommunication":[-3928,343057],"Healthcare":[-5497,504679],"Automobile and Auto Components":[-6533,477593],"Fast Moving Consumer Goods":[-8172,268394],"Financial Services":[-8634,2035663]};
try{const sv=JSON.parse(localStorage.getItem("cfm_nsdl_v1")||"null");if(sv&&sv.data){NSDL=sv.data;if(sv.date)NSDL_DATE=sv.date;if(sv.history)NSDL_HISTORY=sv.history;}}catch(e){}
let FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));

const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const avg=a=>(a&&a.length)?a.reduce((x,y)=>x+y,0)/a.length:0;
const fmt=n=>Math.abs(n||0).toLocaleString("en-IN");
const capOf=v=>/micro/i.test(v||"")?"Micro":/mid/i.test(v||"")?"Mid":/small/i.test(v||"")?"Small":/large/i.test(v||"")?"Large":"";
const ago=n=>n===""||n===undefined||n===null?"":Number(n)===0?"today":Number(n)===1?"1 bar ago":n+" bars ago";
function resolveSym(v){let s=(v||"").trim().toUpperCase().replace(/\.NS$/,"").replace(/\s+/g,"");if(!s)return"";if(s==="APAR"||s==="APARINDUSTRIES")return"APARINDS";const ex=rows.find(x=>x.Symbol.toUpperCase()===s);if(ex)return ex.Symbol;const pt=rows.find(x=>x.Symbol.toUpperCase().startsWith(s));return pt?pt.Symbol:s;}

function sample(){
  const out=[];let k=1;
  for(const [ind,txt] of Object.entries(SAMPLE)){txt.split("|").forEach((grp,ci)=>{grp.split(",").forEach(sym=>{k=(k*17+13)%100;const up=k>45,px=+(150+k*18).toFixed(1);out.push({Symbol:sym,Industry:ind,Cap:CAPS[ci]||"Mid",Price:px,"1W":+(up?2.1:-1.8),"1M":+(up?5.4:-4.2),"3M":+(up?11.2:-7.5),"6M":+(up?18:-9.1),Daily:up?"BUY":"SELL",Weekly:up?"BUY":"SELL",DFresh:"",WFresh:"",DCross:up?"UP":"DN",DCrossAgo:k%4,WCross:up?"UP":"DN",WCrossAgo:k%4,DTurnAgo:k%4,WTurnAgo:k%4,EMA20:up?"Above":"Below",EMA50:up?"Above":"Below",RSState:up?"Rising":"Falling",RSPos:up?"Y":"N",RS_Rank:Math.max(10,k),RSI_D:up?62:38,DConfirmed:"Y",WConfirmed:"Y",DLine:+(px*0.97).toFixed(1),DUpper:+(px*1.08).toFixed(1),DLower:+(px*0.93).toFixed(1),SahilD:up?"BUY":"SELL",SahilDAgo:k%4,SahilD_BO:+(px*1.03).toFixed(1),SahilD_TSL:+(px*0.92).toFixed(1),SahilW:up?"BUY":"SELL",SahilWAgo:k%4,SahilW_BO:+(px*1.06).toFixed(1),SahilW_TSL:+(px*0.89).toFixed(1)});});});}
  return out;
}
function splitCSV(l){const o=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===","&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
function parseCSV(t){const L=t.replace(/^\uFEFF/,"").trim().split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];const h=splitCSV(L.shift()).map(x=>x.trim());return L.map(l=>{const c=splitCSV(l),o={};h.forEach((k,i)=>o[k]=c[i]?c[i].trim():"");return o;});}
const canon=x=>{const n=(x||"").replace(/,/g,"").trim();return Object.keys(NSDL).find(k=>k.replace(/,/g,"")===n)||(x||"").trim()};

function load(recs){
  bench={};rows=[];
  for(const r of recs){
    const o={Symbol:r.Symbol||"?",Industry:canon(r.Industry),Cap:capOf(r.Cap),Price:parseFloat(r.Price)||"",Daily:(r.Daily||"").toUpperCase(),Weekly:(r.Weekly||"").toUpperCase(),DFresh:r.DFresh||"",WFresh:r.WFresh||"",DTurnAgo:r.DTurnAgo!==""&&r.DTurnAgo!==undefined?+r.DTurnAgo:"",WTurnAgo:r.WTurnAgo!==""&&r.WTurnAgo!==undefined?+r.WTurnAgo:"",DCross:(r.DCross||"").toUpperCase(),DCrossAgo:r.DCrossAgo!==""&&r.DCrossAgo!==undefined?+r.DCrossAgo:"",WCross:(r.WCross||"").toUpperCase(),WCrossAgo:r.WCrossAgo!==""&&r.WCrossAgo!==undefined?+r.WCrossAgo:"",EMA20:r.EMA20||"",EMA50:r.EMA50||"",RSState:r.RSState||"",RSPos:(r.RSPos||"").toUpperCase(),RS_Rank:parseInt(r.RS_Rank)||50,RSI_D:parseFloat(r.RSI_D),DConfirmed:(r.DConfirmed||"").toUpperCase(),WConfirmed:(r.WConfirmed||"").toUpperCase(),DLine:parseFloat(r.DLine),DUpper:parseFloat(r.DUpper),DLower:parseFloat(r.DLower),SahilD:(r.SahilD||"").toUpperCase(),SahilDAgo:r.SahilDAgo!==""&&r.SahilDAgo!==undefined?+r.SahilDAgo:"",SahilD_BO:r.SahilD_BO||"",SahilD_TSL:r.SahilD_TSL||"",SahilW:(r.SahilW||"").toUpperCase(),SahilWAgo:r.SahilWAgo!==""&&r.SahilWAgo!==undefined?+r.SahilWAgo:"",SahilW_BO:r.SahilW_BO||"",SahilW_TSL:r.SahilW_TSL||""};
    PERIODS.forEach(([p])=>o[p]=parseFloat(r[p]));
    if(/^NIFTY ?500$/i.test(o.Symbol))PERIODS.forEach(([p])=>bench[p]=o[p]);
    else if(o.Industry&&!isNaN(o[period]))rows.push(o);
  }
  PERIODS.forEach(([p])=>{if(bench[p]==null){const v=rows.map(x=>x[p]).filter(x=>!isNaN(x));bench[p]=v.length?avg(v):0}});
  renderTop5();render();
}

function buyScore(r,sm){let s=0,R=[];if(r.Daily==="BUY"&&r.DConfirmed==="Y"){s+=2;R.push("Daily BUY")}if(r.Weekly==="BUY"&&r.WConfirmed==="Y"){s+=2;R.push("Weekly BUY")}if(!isNaN(r.RSI_D)&&r.RSI_D>40&&r.RSI_D<70){s+=1;R.push("RSI healthy")}if(r.RSPos==="Y"){s+=1;R.push("RS+")}if(r.RSState==="Rising"){s+=1;R.push("RS rising")}if(r.RS_Rank>=80){s+=1;R.push("RS "+r.RS_Rank)}if((r.DTurnAgo!==""&&r.DTurnAgo<=2)||(r.WTurnAgo!==""&&r.WTurnAgo<=1)){s+=1;R.push("fresh")}if(!isNaN(r["1M"])&&r["1M"]>sm){s+=1;R.push("beats sector")}return{score:s,reasons:R};}
function slTarget(r){return isNaN(r.DLine)?null:{sl:r.DLower,target:r.DUpper};}
function wlGet(){try{return JSON.parse(localStorage.getItem("cfm_watchlist_v1")||"{}")}catch(e){return{}}}
function wlSet(sym,status,price){try{const w=wlGet();w[sym]={status,price:price||"",added:new Date().toISOString().slice(0,10)};localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist();if(mode==="watchlist")renderWatchlistTab()}
function wlRemove(sym){try{const w=wlGet();delete w[sym];localStorage.setItem("cfm_watchlist_v1",JSON.stringify(w))}catch(e){}renderWatchlist();if(mode==="watchlist")renderWatchlistTab()}
function watchBtns(sym,price){const st=(wlGet()[sym]||{}).status||"";return`<button data-wl="watch" data-sym="${esc(sym)}" data-px="${price||""}" style="padding:3px 8px;font-size:10px;border-radius:10px;border:1px solid var(--mut);background:${st==="watch"?"var(--fg)":"var(--card)"};color:${st==="watch"?"var(--bg)":"var(--fg)"}">${st==="watch"?"★ Watching":"☆ Watch"}</button> <button data-wl="bought" data-sym="${esc(sym)}" data-px="${price||""}" style="padding:3px 8px;font-size:10px;border-radius:10px;border:1px solid var(--mut);background:${st==="bought"?"var(--gc)":"var(--card)"};color:${st==="bought"?"#fff":"var(--fg)"}">${st==="bought"?"✓ Bought":"Mark Bought"}</button>`;}

function renderWatchlist(){
  const el=document.getElementById("wl"),w=wlGet(),syms=Object.keys(w);el.style.display="block";
  const lines=syms.map(sym=>{const rec=w[sym],r=rows.find(x=>x.Symbol.toUpperCase()===sym.toUpperCase()),now=r?r.Price:"",chg=(now&&rec.price)?((now-rec.price)/rec.price*100):null;return`<div class="sr"><button data-wlrm="${esc(sym)}" style="float:right;border:none;background:none;color:var(--mut);font-size:16px;cursor:pointer">✕</button><b>${esc(sym)}</b> <i class="cp">${rec.status==="bought"?"Bought":"Watching"}</i>${r?` <span class="cp">RS:${r.RS_Rank}</span>`:""}<small>${now?"₹"+now:""}${chg!==null?" ("+(chg>=0?"+":"")+chg.toFixed(1)+"%)":""}${r?" · Daily "+r.Daily+" · Weekly "+r.Weekly:""}</small></div>`;}).join("");
  el.innerHTML=`<h3>⭐ My Watchlist</h3><div style="display:flex;gap:8px;margin:8px 0;max-width:360px"><input id="wlHomeInput" type="text" placeholder="Symbol (e.g. APARINDS)..." style="flex:1;border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 14px;font-size:12px;text-transform:uppercase"><button id="wlHomeAddBtn" style="border:1px solid var(--mut);background:var(--fg);color:var(--bg);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:12px">+ Add</button></div><div class="sl">${lines||"<small style='color:var(--mut)'>No stocks yet.</small>"}</div>`;
  const add=()=>{const inp=document.getElementById("wlHomeInput");if(!inp)return;const v=resolveSym(inp.value);if(!v)return;const f=rows.find(x=>x.Symbol.toUpperCase()===v.toUpperCase());wlSet(v,"watch",f?f.Price:"");inp.value="";};
  document.getElementById("wlHomeAddBtn").onclick=add;document.getElementById("wlHomeInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add();}};
}

function renderWatchlistTab(){
  hideAll("wlView");const el=document.getElementById("wlView"),w=wlGet(),syms=Object.keys(w);
  const cards=syms.map(sym=>{const rec=w[sym],r=rows.find(x=>x.Symbol.toUpperCase()===sym.toUpperCase()),now=r?r.Price:"",st=r?slTarget(r):null;return`<div class="sr"><button data-wlrm="${esc(sym)}" style="float:right;border:none;background:none;color:var(--mut);font-size:18px;cursor:pointer">✕</button><b>${esc(sym)}</b> · ₹${now||"—"} ${r?`<span class="cp">RS:${r.RS_Rank}</span>`:""}<div style="margin:6px 0"><span class="sg ${r&&r.Daily==="BUY"?"b":"s"}">Daily ${r?r.Daily:"—"}</span><span class="sg ${r&&r.Weekly==="BUY"?"b":"s"}">Weekly ${r?r.Weekly:"—"}</span></div>${st?`<small>SL ~₹${st.sl} · Target ~₹${st.target}</small>`:""}</div>`;}).join("");
  el.innerHTML=`<h3>⭐ My Watchlist — Live Signals</h3><div style="display:flex;gap:8px;margin:10px 0;max-width:400px"><input id="wlAddInput" type="text" placeholder="Symbol..." style="flex:1;border:1px solid var(--mut);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px;font-size:13px;text-transform:uppercase"><button id="wlAddBtn" style="border:1px solid var(--mut);background:var(--fg);color:var(--bg);border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:700">+ Add</button></div><div class="sl">${cards||"<small>Watchlist is empty.</small>"}</div>`;
  const add=()=>{const inp=document.getElementById("wlAddInput");if(!inp)return;const v=resolveSym(inp.value);if(!v)return;const f=rows.find(x=>x.Symbol.toUpperCase()===v.toUpperCase());wlSet(v,"watch",f?f.Price:"");inp.value="";};
  document.getElementById("wlAddBtn").onclick=add;document.getElementById("wlAddInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add();}};
  document.getElementById("tabs").innerHTML=bar(false);
}

document.addEventListener("click",e=>{const d=e.target.dataset;if(d.wl)wlSet(d.sym,d.wl,parseFloat(d.px)||"");else if(d.wlrm)wlRemove(d.wlrm);});
let simpleMode=false;document.getElementById("simpleBtn").onclick=()=>{simpleMode=!simpleMode;document.getElementById("advWrap").style.display=simpleMode?"none":"block";document.getElementById("simpleBtn").textContent=simpleMode?"🔍 Advanced Mode":"🎯 Simple Mode";};

function card(i,name,stocks,inflow){
  const m=avg(stocks.map(s=>s[period])),b=bench[period]||0,rel=m-b,beat=stocks.filter(s=>s[period]>b).length,top=stocks.filter(sigOK).sort((a,c)=>inflow?c[period]-a[period]:a[period]-c[period]);

function applyNsdlPaste(txt,manualDate){
  const mDate=txt.match(/(\d{1,2}\s*[–-]\s*\d{1,2}\s+[A-Za-z]{3,9}\s+20\d\d|[A-Za-z]{3,9}\s+\d{1,2}\s*[–-]\s*\d{1,2},?\s+20\d\d|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2},?\s+20\d\d|\d{1,2}[-/\s](?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[-/\s]20\d\d)/i);
  const dt=(manualDate&&manualDate.trim())?manualDate.trim():(mDate?mDate[1]:"1–15 Nov 2026");
  const flat=txt.replace(/\s+/g," ").replace(/,/g,"").replace(/₹/g,"").replace(/Cr/g,"");
  const secs=Object.keys(NSDL).sort((a,b)=>b.length-a.length),pos=[],occ=[];
  for(const s of secs){const rx=new RegExp(s.replace(/,/g,"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),m=rx.exec(flat);if(m){const st=m.index,en=st+m[0].length;if(!occ.some(([a,b])=>st<b&&en>a)){pos.push([st,en,s]);occ.push([st,en]);}}}
  pos.sort((a,b)=>a[0]-b[0]);
  if(pos.length<5){alert("NSDL ટેબલનો ડેટા મળ્યો નથી. NSDL પેજ પર Select All કરીને Copy કરો.");return false;}
  const nextData={...NSDL};
  for(let i=0;i<pos.length;i++){
    const [st,en,s]=pos[i],nextSt=i+1<pos.length?pos[i+1][0]:Math.min(flat.length,en+450);
    let nums=(flat.slice(en,nextSt).match(/[+-]?\d+(?:\.\d+)?/g)||[]).map(Number);
    if((nums.length===37||nums.length===35||nums.length===19||nums.length===13||nums.length===3)&&nums[nums.length-1]>=1&&nums[nums.length-1]<=25)nums=nums.slice(0,-1);
    if(nums.length>=28)nextData[s]=[nums[12],nums[nums.length-12]];
    else if(nums.length>=14)nextData[s]=[nums[6],nums[nums.length-6]];
    else if(nums.length>=8)nextData[s]=[nums[4],nums[nums.length-4]];
    else if(nums.length>=2)nextData[s]=[nums[0],nums[1]];
    else if(nums.length===1)nextData[s]=[nums[0],NSDL[s]?NSDL[s][1]:50000];
    if(NSDL_HISTORY[s])NSDL_HISTORY[s]=[...NSDL_HISTORY[s].slice(-9),nextData[s][0]];
  }
  NSDL=nextData;NSDL_DATE=dt;FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));
  try{localStorage.setItem("cfm_nsdl_v1",JSON.stringify({source:"paste",date:NSDL_DATE,data:NSDL,history:NSDL_HISTORY}));}catch(e){}
  mode="fpi";render();note("NSDL FPI updated: "+NSDL_DATE+" ("+pos.length+" sectors)");return true;
}

let sm="BUY",mkrTf="D",mkrFresh=true,so=false;
function mkrInfo(x){
  const b=sm==="BUY",isD=mkrTf==="D",sigVal=isD?x.Daily:x.Weekly;if(sigVal!==sm)return null;
  const tRaw=isD?x.DTurnAgo:x.WTurnAgo,cDir=isD?x.DCross:x.WCross,cRaw=isD?x.DCrossAgo:x.WCrossAgo;
  const tAge=(tRaw!==""&&tRaw!==undefined&&!isNaN(tRaw))?Number(tRaw):999;
  const cAge=(cDir===(b?"UP":"DN")&&cRaw!==""&&cRaw!==undefined&&!isNaN(cRaw))?Number(cRaw):999;
  const minAgo=Math.min(tAge,cAge),R=[],tfLabel=isD?"Daily":"Weekly";
  if(tAge!==999)R.push(`${tfLabel} line ${b?"up":"down"} (${ago(tAge)})`);
  if(cAge!==999)R.push(`${tfLabel} crossed ${b?"above":"below"} line (${ago(cAge)})`);
  if(!R.length)R.push(`${tfLabel} ${sm}`);
  return{R,minAgo};
}
function renderSig(all,inSet,outSet){
  const el=document.getElementById("sigp"),b=sm==="BUY";el.style.display="block";
  const it=all.map(x=>{const info=mkrInfo(x);if(!info)return null;if(mkrFresh&&info.minAgo>3)return null;const ins=inSet?inSet.has(x.Industry):false,outs=outSet?outSet.has(x.Industry):false;if(so&&!ins)return null;return{x,R:info.R,minAgo:info.minAgo,ins,outs};}).filter(Boolean).sort((a,c)=>a.minAgo-c.minAgo||(c.x.RS_Rank||50)-(a.x.RS_Rank||50));
  el.innerHTML=`<h3>${b?"▲ Multi Kernel Regression BUY":"▼ Multi Kernel Regression SELL"} (${mkrTf==="D"?"Daily":"Weekly"}) — ${it.length} stocks</h3>
  <div class="bar"><button class="${mkrTf==="D"?"on":""}" data-mtf="D">Daily</button><button class="${mkrTf==="W"?"on":""}" data-mtf="W">Weekly</button><button class="${b?"on":""}" data-sm="BUY">BUY ▲</button><button class="${!b?"on":""}" data-sm="SELL">SELL ▼</button><button class="${mkrFresh?"on":""}" data-mfr="1">Fresh (0–3 bars)</button><button class="${!mkrFresh?"on":""}" data-mfr="0">All Active</button><button class="${!so?"on":""}" data-so="0">All sectors</button><button class="${so?"on":""}" data-so="1">Money-inflow only</button></div>
  <div class="sl">${it.map(o=>`<div class="sr"><span class="r" style="color:var(--${o.x[period]>=0?"gc":"rc"})">${o.x[period]>=0?"+":""}${o.x[period].toFixed(1)}%</span><b>${esc(o.x.Symbol)}</b>${o.minAgo<999?` <i class="sg ${b?"b":"s"}">${ago(o.minAgo)}</i>`:""}${o.ins?` <i class="sg b">money in</i>`:""}${o.outs?` <i class="sg s">money out</i>`:""}<small>${esc(o.x.Industry)} · RS ${o.x.RS_Rank} · ₹${o.x.Price||"—"}</small><small>${o.R.join(" · ")}</small></div>`).join("")||"<small>No fresh MKR signals in 0–3 bars. Tap 'All Active'.</small>"}</div>`;
}
document.getElementById("sigp").onclick=e=>{const d=e.target.dataset;if(d.mtf){mkrTf=d.mtf;render()}else if(d.sm){sm=d.sm;render()}else if(d.mfr!==undefined){mkrFresh=d.mfr==="1";render()}else if(d.so!==undefined){so=d.so==="1";render()}};

let sahilTf="D",sahilFresh=true;
function renderSahil(){
  hideAll("sahil");const el=document.getElementById("sahil"),fld=sahilTf==="W"?"SahilW":"SahilD",agoFld=sahilTf==="W"?"SahilWAgo":"SahilDAgo",boFld=sahilTf==="W"?"SahilW_BO":"SahilD_BO",tslFld=sahilTf==="W"?"SahilW_TSL":"SahilD_TSL";
  const getAge=r=>(r[agoFld]!==""&&r[agoFld]!==undefined&&!isNaN(r[agoFld]))?Number(r[agoFld]):999;
  const isOk=r=>r[fld]&&(!sahilFresh||getAge(r)<=3);
  const byFresh=(a,b)=>(getAge(a)-getAge(b))||((b.RS_Rank||50)-(a.RS_Rank||50));
  const buys=rows.filter(r=>r[fld]==="BUY"&&isOk(r)).sort(byFresh),sells=rows.filter(r=>r[fld]==="SELL"&&isOk(r)).sort(byFresh);
  el.innerHTML=`<h3>Breakout Scanner (${sahilTf==="W"?"Weekly":"Daily"} · 55/20)</h3><div class="bar"><button class="${sahilTf==="D"?"on":""}" data-stf="D">Daily</button><button class="${sahilTf==="W"?"on":""}" data-stf="W">Weekly</button><button class="${sahilFresh?"on":""}" data-sfr="1">Fresh (0–3 bars)</button><button class="${!sahilFresh?"on":""}" data-sfr="0">All Active</button></div><div class="grid"><div><h4 style="color:var(--rc)">EXIT / SELL — ${sells.length}</h4><div class="sl">${sells.map(r=>`<div class="sr"><b>${esc(r.Symbol)}</b>${getAge(r)<999?` <i class="sg s">${ago(getAge(r))}</i>`:""} <span class="cp">RS:${r.RS_Rank}</span> · ₹${r.Price||"—"}<small>${esc(r.Industry)}${r[tslFld]?" · TSL: ₹"+r[tslFld]:""}</small></div>`).join("")||"<small>None in 0–3 bars.</small>"}</div></div><div><h4 style="color:var(--gc)">BREAKOUT BUY — ${buys.length}</h4><div class="sl">${buys.map(r=>`<div class="sr"><b>${esc(r.Symbol)}</b>${getAge(r)<999?` <i class="sg b">${ago(getAge(r))}</i>`:""} <span class="cp">RS:${r.RS_Rank}</span> · ₹${r.Price||"—"}<small>${esc(r.Industry)}${r[boFld]?" · High: ₹"+r[boFld]:""}${r[tslFld]?" · TSL: ₹"+r[tslFld]:""}</small></div>`).join("")||"<small>None in 0–3 bars.</small>"}</div></div></div>`;
  document.getElementById("tabs").innerHTML=bar(false);
}
document.getElementById("sahil").onclick=e=>{const d=e.target.dataset;if(d.stf){sahilTf=d.stf;renderSahil()}else if(d.sfr!==undefined){sahilFresh=d.sfr==="1";renderSahil()}};

function render(){
  if(mode==="rotation")return renderRotation();if(mode==="trend")return renderTrend();if(mode==="sahil")return renderSahil();if(mode==="watchlist")return renderWatchlistTab();if(mode==="fpi")return renderF();
  hideAll("grid");const g={};rows.forEach(r=>{if((cap==="All"||r.Cap===cap)&&!isNaN(r[period]))(g[r.Industry]??=[]).push(r);});
  const secs=Object.entries(g).filter(([,v])=>v.length>=(cap==="All"?3:2)).map(([n,v])=>[n,v,avg(v.map(x=>x[period]))]).sort((a,b)=>a[2]-b[2]);
  const all=view==="all",neg=secs.filter(x=>x[2]<0),pos=secs.filter(x=>x[2]>=0).reverse(),O=all?neg:secs.slice(0,5),I=all?pos:secs.slice(-5).reverse();
  document.getElementById("out").innerHTML=O.map(([n,v],i)=>card(i+1,n,v,false)).join("")||"<div class='note'>None</div>";
  document.getElementById("in").innerHTML=I.map(([n,v],i)=>card(i+1,n,v,true)).join("")||"<div class='note'>None</div>";
  renderShort(Object.values(g).flat());renderSig(Object.values(g).flat(),new Set(I.map(x=>x[0])),new Set(O.map(x=>x[0])));
  const b=bench[period]||0;document.getElementById("sub").textContent=`${PERIODS.find(p=>p[0]===period)[1]} · Nifty 500 ${b>=0?"+":""}${b.toFixed(1)}% · money moved OUT (left) and INTO (right)`;
  document.getElementById("tabs").innerHTML=bar(true);
}

let cur=sample();
document.getElementById("tabs").onclick=e=>{const d=e.target.dataset;if(d.p){period=d.p;load(cur)}else if(d.v){view=d.v;render()}else if(d.m){mode=d.m;render()}else if(d.c){cap=d.c;render()}else if(d.s){sig=d.s;render()}};
const note=t=>document.getElementById("note").textContent=t;
function useCSV(text,name){
  if(/Financial Services/i.test(text)&&/Automobile and Auto Components/i.test(text)&&!/^Symbol,Industry/i.test(text.trim())){if(applyNsdlPaste(text))return;}
  try{const recs=parseCSV(text);if(!recs.length||!("Industry" in recs[0])||!("1M" in recs[0]))throw 0;cur=recs;load(cur);note("Showing: "+name+" ("+recs.length+" stocks)");}catch(e){note("Could not parse CSV.");}
}
document.getElementById("f").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>useCSV(t,f.name));};
document.getElementById("pb").onclick=()=>{const w=document.getElementById("pw");w.style.display=w.style.display==="none"?"block":"none";};
document.getElementById("pgo").onclick=()=>useCSV(document.getElementById("ta").value,"pasted data");

load(cur);
fetch("nsdl.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{let hp=false;try{const sv=JSON.parse(localStorage.getItem("cfm_nsdl_v1")||"null");if(sv&&sv.source==="paste")hp=true;}catch(e){}if(hp)return;if(j.data)NSDL=j.data;if(j.date)NSDL_DATE=j.date;if(j.history)NSDL_HISTORY=j.history;FPI=Object.fromEntries(Object.entries(NSDL).map(([k,v])=>[k,v[1]]));render();}).catch(()=>{});
fetch("flow.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{useCSV(t,"flow.csv");note("Live data · updated automatically after market close");}).catch(()=>{});
</script></body></html>
