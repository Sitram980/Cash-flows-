name: Update Capital Flow data
on:
  schedule:
    - cron: '30 11 * * 1-5'     # 5:00 PM IST, Mon-Fri (after market close)
  workflow_dispatch:             # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas yfinance requests
      - run: python update_flow.py
      - name: Commit new data
        run: |
          git config user.name  "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add flow.csv
          git diff --cached --quiet || (git commit -m "Update flow data" && git push)
