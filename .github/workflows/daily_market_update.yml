name: Daily Stock Screener & Flow Update

on:
  schedule:
    # સોમવાર થી શુક્રવાર સાંજે 4:00 PM IST (10:30 UTC)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run market screener
        run: python update_all.py

      - name: Save updated flow.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flow.csv nsdl.json
          git diff --staged --quiet || git commit -m "Auto update daily market data"
          git push
